# Uploads the 3D terrain packs (docs/data/depth/**/*.pmtiles) to the Cloudflare R2 bucket
# vitismundi-terrain and writes docs/data/depth/remote.json, which tells the site where each one lives.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Account > Workers R2 Storage > Edit).
# Optional repository variable CLOUDFLARE_ACCOUNT_ID; otherwise the account is looked up from the token.
#
# Objects are named by content hash (terrain.<sha12>.pmtiles), so an upload never changes a file a
# browser may already be reading; unchanged files are skipped. Old objects are left in the bucket.
name: Terrain packs to R2

on:
  push:
    branches: [main]
    paths: ['docs/data/depth/**/*.pmtiles']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terrain-r2
  cancel-in-progress: false

env:
  BUCKET: vitismundi-terrain
  WRANGLER: wrangler@4

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            docs/data/depth
            .github

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the token and find the account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          if [ -n "$ACCOUNT_VAR" ]; then id="$ACCOUNT_VAR"; else
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$id" ]; then echo "::error::Could not find the Cloudflare account from the token. Set repository variable CLOUDFLARE_ACCOUNT_ID."; exit 1; fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Public URL and browser access (CORS)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes $WRANGLER r2 bucket dev-url enable "$BUCKET" --force
          cat > cors.json <<'JSON'
          {"rules":[{"allowed":{"origins":["https://vitismundi.app","https://www.vitismundi.app","https://tolar-dio.github.io","http://localhost:8765","http://127.0.0.1:8765"],"methods":["GET","HEAD"],"headers":["Range"]},"exposeHeaders":["Content-Range","Content-Length","Accept-Ranges","ETag"],"maxAgeSeconds":86400}]}
          JSON
          npx --yes $WRANGLER r2 bucket cors set "$BUCKET" --file cors.json --force
          url=$(npx --yes $WRANGLER r2 bucket dev-url get "$BUCKET" | grep -o 'https://pub-[a-z0-9]*\.r2\.dev' | head -1)
          if [ -z "$url" ]; then echo "::error::Could not read the bucket's public r2.dev URL"; exit 1; fi
          echo "PUBLIC_BASE=$url/" >> "$GITHUB_ENV"
          echo "Public URL: $url"

      - name: Upload terrain packs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/terrain_r2.py

      - name: Commit remote.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/depth/remote.json
          if git diff --cached --quiet; then echo "remote.json unchanged"; exit 0; fi
          git commit -m "Terrain packs on R2: update remote.json"
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
