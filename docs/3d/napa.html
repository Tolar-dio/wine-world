<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Napa Valley · 3D</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1420; font-family: Georgia, 'Times New Roman', serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hud { position: fixed; color: #f2ead8; pointer-events: none; user-select: none; text-shadow: 0 1px 3px rgba(0,0,0,.75); }
  #title { top: 18px; left: 22px; }
  #title h1 { font-size: 22px; font-weight: 500; letter-spacing: .12em; }
  #title h1 span { color: #d9b36a; }
  #title p { font-size: 11.5px; letter-spacing: .24em; color: #cbbfa2; margin-top: 4px; }
  #stats { top: 18px; right: 20px; text-align: right; font-size: 11px; line-height: 1.5; color: #d8ccae; font-family: system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #hint { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #e6dcc2;
    background: rgba(14,16,18,.5); border: 1px solid rgba(217,179,106,.25); border-radius: 18px;
    padding: 7px 18px; letter-spacing: .04em; white-space: nowrap; }
  #hint b { color: #d9b36a; font-weight: 600; }
  #panel { position: fixed; right: 18px; bottom: 18px; color: #e6dcc2; font-family: system-ui, sans-serif;
    background: rgba(14,16,18,.55); border: 1px solid rgba(217,179,106,.2); border-radius: 12px; padding: 10px 14px; }
  #panel label { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .03em; margin: 4px 0; }
  #panel input[type=range] { width: 120px; accent-color: #d9b36a; }
  #panel b { font-variant-numeric: tabular-nums; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #202a38 0%, #0e1420 75%); color: #e6dcc2; transition: opacity .6s; z-index: 20; }
  #load h2 { font-size: 26px; font-weight: 500; letter-spacing: .16em; }
  #load .sub { font-size: 11px; letter-spacing: .28em; color: #b3a888; margin-top: 8px; }
  #load .p { margin-top: 14px; font-family: system-ui, sans-serif; font-size: 12px; color: #9d9278; }
  .spin { width: 26px; height: 26px; margin-top: 24px; border: 2px solid rgba(217,179,106,.25); border-top-color: #d9b36a; border-radius: 50%; animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .gone { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title"><h1>NAPA <span>VALLEY</span></h1><p>CALIFORNIA · VINES · TREES · BUILDINGS</p></div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint"><b>Drag</b> orbit &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>Right-drag</b> pan &nbsp;·&nbsp; <b>Shift+drag</b> tilt</div>
<div id="panel">
  <label>Relief <input type="range" id="exag" min="0.8" max="2.5" step="0.05" value="1.4"> <b id="exag-v">1.4×</b></label>
  <label>Vines <input type="range" id="vines" min="0" max="1" step="0.1" value="1"> <b id="vines-v">100%</b></label>
  <label>Shadows <input type="checkbox" id="shadows" checked></label>
</div>
<div id="load"><h2>NAPA VALLEY</h2><div class="sub">PLANTING VINES · GROWING TREES</div><div class="spin"></div><div class="p" id="load-p">loading terrain…</div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const BASE = new URL('.', location.href).href;
const EXAG = 1.4;
const urlLimit = parseInt(new URLSearchParams(location.search).get('limit') || '0') || 0;   // ?limit=N caps instances
const setP = s => document.getElementById('load-p').textContent = s;

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdcc89a, 2500, 26000);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 2, 90000);
camera.position.set(0, 2000, 7000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 60, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 40; controls.maxDistance = 22000;

// ---------- sky ----------
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#1c3a6e'); grad.addColorStop(0.35, '#7ba7cf'); grad.addColorStop(0.6, '#c8d3c4');
  grad.addColorStop(0.8, '#e6d2a6'); grad.addColorStop(1, '#c79a68');
  g.fillStyle = grad; g.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xcfe0f2, 0x5a4a38, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 12000;
const SC = 2600;
sun.shadow.camera.left = -SC; sun.shadow.camera.right = SC;
sun.shadow.camera.top = SC; sun.shadow.camera.bottom = -SC;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);

// ---------- terrain heightfield ----------
function loadImage(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }

const meta = await (await fetch(BASE + 'napa/meta.json')).json();
const span = meta.spanM, half = span / 2, gw = meta.gridW, gh = meta.gridH;

const himg = await loadImage(BASE + 'napa/height.png');
const hc = document.createElement('canvas'); hc.width = himg.width; hc.height = himg.height;
const hctx = hc.getContext('2d'); hctx.drawImage(himg, 0, 0);
const hd = hctx.getImageData(0, 0, himg.width, himg.height).data;
const heights = new Float32Array(gw * gh);
for (let i = 0; i < gw * gh; i++) heights[i] = hd[i*4]*256 + hd[i*4+1] + hd[i*4+2]/256 - 32768;
function sampleH(x, z) {
  const col = (x + half) / span * gw - 0.5, row = (half - z) / span * gh - 0.5;
  const c0 = Math.max(0, Math.min(gw-1, Math.floor(col))), r0 = Math.max(0, Math.min(gh-1, Math.floor(row)));
  const c1 = Math.min(gw-1, c0+1), r1 = Math.min(gh-1, r0+1);
  const fc = col - c0, fr = row - r0;
  const a = heights[r0*gw+c0], b = heights[r0*gw+c1], c = heights[r1*gw+c0], d = heights[r1*gw+c1];
  return (a*(1-fc)*(1-fr) + b*fc*(1-fr) + c*(1-fc)*fr + d*fc*fr) * EXAG;
}

// ---------- terrain mesh ----------
setP('building terrain…');
const SEG = 480;
{
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((SEG+1)*(SEG+1)*3);
  const uv = new Float32Array((SEG+1)*(SEG+1)*2);
  const idx = [];
  for (let j = 0; j <= SEG; j++) {
    const v = j / SEG, z = -half + v * span;
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG, x = -half + u * span;
      const k = (j*(SEG+1)+i);
      pos[k*3] = x; pos[k*3+1] = sampleH(x, z); pos[k*3+2] = z;
      uv[k*2] = u; uv[k*2+1] = v;
    }
  }
  for (let j = 0; j < SEG; j++) for (let i = 0; i < SEG; i++) {
    const a = j*(SEG+1)+i, b = a+1, c = a+SEG+1, d = c+1;
    idx.push(a, c, b, b, c, d);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const ortho = new THREE.Texture(await loadImage(BASE + 'napa/ortho.jpg'));
  ortho.colorSpace = THREE.SRGBColorSpace; ortho.anisotropy = 8; ortho.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial({ map: ortho, roughness: 0.96, metalness: 0 });
  const terrain = new THREE.Mesh(geo, mat);
  terrain.receiveShadow = true;
  scene.add(terrain);
}

// ---------- helpers ----------
function leafTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.clearRect(0,0,64,64);
  for (let i = 0; i < 60; i++) {
    const x = 32 + (Math.random()-0.5)*40, y = 32 + (Math.random()-0.5)*40, r = 2 + Math.random()*5;
    const gb = 75 + Math.random()*55, rd = 45 + Math.random()*25;
    g.fillStyle = `rgba(${rd},${gb},${30+Math.random()*18},${0.85+Math.random()*0.15})`;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
async function loadBin(name) {
  try {
    const buf = await (await fetch(BASE + 'napa/' + name)).arrayBuffer();
    return new Float32Array(buf);
  } catch (e) { return new Float32Array(0); }
}
function addInstanced(geo, mat, data, stride, variantIdx, castShadow) {
  let count = Math.floor(data.length / stride);
  if (urlLimit > 0 && count > urlLimit) count = urlLimit;
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let n = 0;
  for (let i = 0; i < count; i++) {
    const o = i * stride;
    const x = data[o], z = data[o+1], y = data[o+2] * EXAG, sc = data[o+3];
    e.set(0, ((i * 2654435761) % 360) * Math.PI/180, 0); q.setFromEuler(e);
    s.set(sc, sc, sc); p.set(x, y, z);
    m.compose(p, q, s);
    mesh.setMatrixAt(n++, m);
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  mesh.castShadow = castShadow; mesh.receiveShadow = false;
  mesh.frustumCulled = false;
  return mesh;
}

// ---------- vines ----------
setP('planting vines…');
{
  const vd = await loadBin('vines.bin');
  const ltex = leafTexture();
  const q1 = new THREE.PlaneGeometry(0.85, 1.15); q1.translate(0, 0.575, 0);
  const q2 = new THREE.PlaneGeometry(0.85, 1.15); q2.rotateY(Math.PI/2); q2.translate(0, 0.575, 0);
  const vgeo = mergeGeometries([q1, q2]);
  const vmat = new THREE.MeshStandardMaterial({ map: ltex, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.95, color: 0xa8c07a });
  const vines = addInstanced(vgeo, vmat, vd, 5, 4, true);
  scene.add(vines);
  window.__vines = vines;
}

// ---------- trees ----------
setP('growing trees…');
try {
  const td = await loadBin('trees.bin');
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4c6b34, roughness: 1 });
  const geos = [
    // 0 oak
    (() => { const t = new THREE.CylinderGeometry(0.18, 0.3, 3.2, 5).toNonIndexed(); t.translate(0, 1.6, 0);
      const f = new THREE.IcosahedronGeometry(2.6, 1).toNonIndexed(); f.scale(1, 0.85, 1); f.translate(0, 4.2, 0);
      return mergeGeometries([t, f]); })(),
    // 1 cypress
    (() => { const t = new THREE.CylinderGeometry(0.2, 0.35, 2.4, 5).toNonIndexed(); t.translate(0, 1.2, 0);
      const f = new THREE.ConeGeometry(1.6, 8, 7).toNonIndexed(); f.translate(0, 6.5, 0);
      return mergeGeometries([t, f]); })(),
    // 2 olive
    (() => { const t = new THREE.CylinderGeometry(0.15, 0.25, 1.6, 5).toNonIndexed(); t.translate(0, 0.8, 0);
      const f = new THREE.IcosahedronGeometry(1.6, 0).toNonIndexed(); f.translate(0, 2.1, 0);
      return mergeGeometries([t, f]); })(),
  ];
  for (let v = 0; v < 3; v++) {
    const idx = [];
    for (let i = 0; i < td.length; i += 5) if (Math.round(td[i+4]) === v) idx.push(i);
    if (!idx.length) continue;
    const subset = new Float32Array(idx.length * 5);
    idx.forEach((k, n) => subset.set(td.subarray(k, k+5), n*5));
    const mesh = addInstanced(geos[v], leafMat, subset, 5, 4, true);
    scene.add(mesh);
  }
} catch (e) { console.warn('trees unavailable', e); }

// ---------- buildings ----------
setP('raising buildings…');
try {
  const b = await (await fetch(BASE + 'napa/buildings.json')).json();
  const geos = [];
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xcbb49a, roughness: 0.9 });
  for (const bd of b.buildings) {
    if (!bd.ring || bd.ring.length < 4) continue;
    const shape = new THREE.Shape();
    shape.moveTo(bd.ring[0][0], bd.ring[0][1]);
    for (let i = 1; i < bd.ring.length - 1; i++) shape.lineTo(bd.ring[i][0], bd.ring[i][1]);
    shape.closePath();
    let cx = 0, cz = 0;
    for (const [x, z] of bd.ring) { cx += x; cz += z; }
    cx /= bd.ring.length; cz /= bd.ring.length;
    const baseY = sampleH(cx, cz);
    const eg = new THREE.ExtrudeGeometry(shape, { depth: Math.max(3, bd.height), bevelEnabled: false });
    eg.rotateX(Math.PI / 2);
    eg.translate(0, baseY, 0);
    geos.push(eg);
  }
  if (geos.length) {
    const merged = mergeGeometries(geos, false);
    const bmesh = new THREE.Mesh(merged, wallMat);
    bmesh.castShadow = true; bmesh.receiveShadow = true;
    bmesh.frustumCulled = false;
    scene.add(bmesh);
  }
} catch (e) { console.warn('buildings unavailable', e); }

// ---------- stylised Napa River ----------
setP('finalising…');
{
  const pts = [];
  for (let j = 0; j <= 200; j++) {
    const v = j / 200, z = -half + v * span;
    const x = -half + span * (0.42 + v * 0.10);
    pts.push(new THREE.Vector3(x, sampleH(x, z) + 0.5, z));
  }
  const tube = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 200, 6, 6, false);
  const water = new THREE.Mesh(tube, new THREE.MeshStandardMaterial({ color: 0x3d6d8a, roughness: 0.25, metalness: 0.1 }));
  water.receiveShadow = true;
  scene.add(water);
}

// ---------- controls ----------
document.getElementById('exag').oninput = e => document.getElementById('exag-v').textContent = (+e.target.value).toFixed(2) + '×';
document.getElementById('vines').oninput = e => { document.getElementById('vines-v').textContent = Math.round(+e.target.value * 100) + '%'; if (window.__vines) window.__vines.visible = +e.target.value > 0.05; };
document.getElementById('shadows').onchange = e => { renderer.shadowMap.enabled = e.target.checked; sun.castShadow = e.target.checked; };

document.getElementById('load').classList.add('gone');

const stats = document.getElementById('stats');
let frames = 0, lastT = performance.now();
function tick() {
  requestAnimationFrame(tick);
  sun.position.copy(camera.position).add(new THREE.Vector3(3000, 4500, -2500));
  sun.target.position.copy(controls.target);
  sun.target.updateMatrixWorld();
  controls.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - lastT > 1000) {
    stats.innerHTML = `${frames} fps<br>${renderer.info.render.triangles.toLocaleString()} tris`;
    frames = 0; lastT = now;
  }
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
