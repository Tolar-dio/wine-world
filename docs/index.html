/* Vitis Mundi */
/* Layout: a full-bleed globe as the atlas plate; marginalia float over it (search and views top-left,
   title cartouche with scale and coordinates bottom-left); the reference sheet is a right-hand
   leaf on desktop and a bottom sheet with three snap points on phones. */
:root {
  /* colour: light (paper-and-ink plate) */
  --space: #e6ebee;
  --ocean: #d9e2e8;
  --land: #f7f6f2;
  --land-wine: #efede6;
  --border: #aab3bf;
  --rule: rgba(28, 32, 48, .15);
  --rule-strong: rgba(28, 32, 48, .32);
  --text: #1c2030;
  --muted: #5d6577;
  --faint: #8a91a0;
  --panel: #fbfaf7;
  --panel-glass: rgba(251, 250, 247, .94);
  --panel-2: #f1efe8;
  --accent: #8e1f3b;
  --accent-ink: #fbfaf7;
  --highlight: #b07a12;
  --river: #8eaac4;
  --river-wine: #3d6c99;
  --lake: #c6d4de;
  --grat: rgba(40, 50, 75, .10);
  --belt: rgba(176, 122, 18, .07);
  --belt-edge: rgba(176, 122, 18, .45);
  --halo: rgba(247, 246, 242, .92);
  --map-label: #3a4052;
  --map-label-wine: #1c2030;
  --shadow: rgba(28, 32, 48, .10);
  /* wine in the glass */
  --w-red: #8e1f3b;
  --w-white: #b0952a;
  --w-rose: #d26c5c;
  --w-sparkling: #9c9a2c;
  --w-sweet: #c4860f;
  --w-fortified: #8a4a22;
  --w-orange: #cf6219;
  --w-mixed: #7a7090;
  /* growing-season temperature ramp, 13 to 24 °C */
  --c0: #2f64a8; --c1: #5f9cc2; --c2: #9fbf8f; --c3: #e1b347; --c4: #d4683a; --c5: #9e2626;
  /* elevation ramp, 0 to 2000 m */
  --e0: #5f8f69; --e1: #a8ab5a; --e2: #c98d45; --e3: #9c5a3a; --e4: #6b4a5e;

  /* type */
  --f-display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-sc: "IM Fell English SC", "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: 12px;
  --fs-sm: 13.5px;
  --fs-base: 16.5px;
  --fs-md: 19px;
  --fs-lg: 24px;
  --fs-xl: 32px;
  --fs-xxl: 40px;

  /* layout */
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --top: calc(env(safe-area-inset-top, 0px) + 12px);
  --bot: calc(env(safe-area-inset-bottom, 0px) + 12px);
  --sheet-w: 448px;
  --ctl: 40px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --space: #080b14;
    --ocean: #0f1422;
    --land: #1d2230;
    --land-wine: #293045;
    --border: #39415a;
    --rule: rgba(235, 230, 220, .12);
    --rule-strong: rgba(235, 230, 220, .28);
    --text: #ebe6dc;
    --muted: #9aa1b2;
    --faint: #6f7689;
    --panel: #151a28;
    --panel-glass: rgba(21, 26, 40, .94);
    --panel-2: #1c2233;
    --accent: #d65a73;
    --accent-ink: #151a28;
    --highlight: #e0b04c;
    --river: #2c4563;
    --river-wine: #5c8fbf;
    --lake: #17213a;
    --grat: rgba(154, 161, 178, .10);
    --belt: rgba(224, 176, 76, .05);
    --belt-edge: rgba(224, 176, 76, .38);
    --halo: rgba(15, 20, 34, .88);
    --map-label: #9aa1b2;
    --map-label-wine: #e3dccd;
    --shadow: rgba(0, 0, 0, .35);
    --w-red: #c44a63;
    --w-white: #e2cf82;
    --w-rose: #ee9a88;
    --w-sparkling: #e8e6a6;
    --w-sweet: #eab04a;
    --w-fortified: #c07a4a;
    --w-orange: #f08c45;
    --w-mixed: #a49bb8;
    --c0: #4f86d0; --c1: #79b4d6; --c2: #b4cf9c; --c3: #ecc25a; --c4: #e8784a; --c5: #d23c3c;
    --e0: #6fa47a; --e1: #b9bb6a; --e2: #d99c55; --e3: #b8714c; --e4: #9a7b92;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --space: #080b14;
  --ocean: #0f1422;
  --land: #1d2230;
  --land-wine: #293045;
  --border: #39415a;
  --rule: rgba(235, 230, 220, .12);
  --rule-strong: rgba(235, 230, 220, .28);
  --text: #ebe6dc;
  --muted: #9aa1b2;
  --faint: #6f7689;
  --panel: #151a28;
  --panel-glass: rgba(21, 26, 40, .94);
  --panel-2: #1c2233;
  --accent: #d65a73;
  --accent-ink: #151a28;
  --highlight: #e0b04c;
  --river: #2c4563;
  --river-wine: #5c8fbf;
  --lake: #17213a;
  --grat: rgba(154, 161, 178, .10);
  --belt: rgba(224, 176, 76, .05);
  --belt-edge: rgba(224, 176, 76, .38);
  --halo: rgba(15, 20, 34, .88);
  --map-label: #9aa1b2;
  --map-label-wine: #e3dccd;
  --shadow: rgba(0, 0, 0, .35);
  --w-red: #c44a63;
  --w-white: #e2cf82;
  --w-rose: #ee9a88;
  --w-sparkling: #e8e6a6;
  --w-sweet: #eab04a;
  --w-fortified: #c07a4a;
  --w-orange: #f08c45;
  --w-mixed: #a49bb8;
  --c0: #4f86d0; --c1: #79b4d6; --c2: #b4cf9c; --c3: #ecc25a; --c4: #e8784a; --c5: #d23c3c;
  --e0: #6fa47a; --e1: #b9bb6a; --e2: #d99c55; --e3: #b8714c; --e4: #9a7b92;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--space);
  color: var(--text);
  font-family: var(--f-body);
  font-size: var(--fs-base);
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: relative; height: 100%; overflow: hidden; isolation: isolate; }
#map {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--ocean) 55%, var(--space)) 0%, var(--space) 62%);
}
#map:focus-visible { outline-offset: -3px; }
.maplibregl-canvas { outline: none; }

.nomap { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 var(--gut-r) 0 var(--gut-l); z-index: 1; }
.nomap p { max-width: 34ch; text-align: center; font-family: var(--f-display); font-style: italic; font-size: var(--fs-md); color: var(--muted); }

/* ---------- marginalia: search + views ---------- */
.mast {
  position: absolute; z-index: 30;
  top: var(--top); left: var(--gut-l);
  width: 380px; max-width: calc(100% - var(--gut-l) - var(--gut-r));
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.mast > * { pointer-events: auto; }
.search { position: relative; z-index: 3; }
.search-box {
  display: flex; align-items: center; gap: 4px;
  height: 46px; padding: 0 4px 0 12px;
  background: var(--panel-glass);
  border: 1px solid var(--rule-strong);
  border-radius: 3px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.search-box:focus-within { border-color: var(--highlight); }
.search-box svg { flex: none; color: var(--muted); }
#q {
  flex: 1; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent;
  font-family: var(--f-body); font-size: 16.5px;
  padding: 0 4px;
}
#q::placeholder { color: var(--muted); font-style: italic; opacity: 1; }
#q::-webkit-search-cancel-button { display: none; }
.icon-btn {
  flex: none; width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 2px; color: var(--muted);
}
.icon-btn:hover { color: var(--text); background: var(--panel-2); }
#results {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px);
  margin: 0; padding: 4px 0; list-style: none;
  background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 3px;
  max-height: min(62vh, 520px); overflow-y: auto; overscroll-behavior: contain;
  box-shadow: 0 10px 30px var(--shadow);
}
#results li { padding: 8px 14px; display: grid; gap: 1px; cursor: pointer; border-left: 2px solid transparent; }
#results li[aria-selected="true"] { background: var(--panel-2); border-left-color: var(--highlight); }
#results .r-name { font-size: 16px; line-height: 1.3; }
#results .r-name mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--highlight); text-underline-offset: 3px; }
#results .r-meta { font-family: var(--f-sc); font-size: 13.5px; color: var(--muted); letter-spacing: .03em; }
#results .r-empty { color: var(--muted); font-style: italic; cursor: default; }

.views {
  display: flex; gap: 0; align-items: stretch;
  background: var(--panel-glass);
  border: 1px solid var(--rule-strong); border-radius: 3px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  overflow-x: auto; scrollbar-width: none;
}
.views::-webkit-scrollbar { display: none; }
.views button {
  flex: 1 0 auto; padding: 7px 10px 8px;
  font-family: var(--f-sc); font-size: 15px; letter-spacing: .03em; line-height: 1.2;
  color: var(--muted);
  border-right: 1px solid var(--rule);
  position: relative;
}
.views button:last-child { border-right: 0; }
.views button:hover { color: var(--text); }
.views button[aria-pressed="true"] { color: var(--text); }
.views button[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: 3px; height: 1.5px; background: var(--accent);
}

/* ---------- map controls ---------- */
.ctl {
  position: absolute; z-index: 20;
  right: var(--gut-r); bottom: calc(var(--bot) + 4px);
  display: flex; flex-direction: column; gap: 6px;
  transition: right .35s var(--ease), opacity .2s;
}
.ctl-group { display: flex; flex-direction: column; background: var(--panel-glass); border: 1px solid var(--rule-strong); border-radius: 3px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.ctl button { width: var(--ctl); height: var(--ctl); display: grid; place-items: center; color: var(--text); }
.ctl-group button + button { border-top: 1px solid var(--rule); }
.ctl button:hover { background: var(--panel-2); }
#compass svg { transition: transform .15s linear; }
#app[data-sheet="open"] .ctl { right: calc(var(--sheet-w) + var(--gut-r) + 12px); }

/* ---------- cartouche: title, legend, scale, coords ---------- */
.cartouche {
  position: absolute; z-index: 15;
  left: var(--gut-l); bottom: var(--bot);
  max-width: min(440px, calc(100% - var(--gut-l) - var(--gut-r) - var(--ctl) - 16px));
  padding: 12px 14px 10px;
  background: var(--panel-glass);
  border: 1px solid var(--rule-strong);
  border-radius: 3px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; gap: 8px;
}
.cartouche::before {
  content: ""; position: absolute; inset: 3px; border: 1px solid var(--rule); border-radius: 1px; pointer-events: none;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: -.005em; }
.brand h1 button { font-style: inherit; }
.brand .sub { font-family: var(--f-sc); font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.hint { margin: 0; font-size: var(--fs-sm); color: var(--muted); font-style: italic; line-height: 1.4; max-width: 46ch; }
.readout { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.readout .coords { color: var(--text); }
.scale { display: flex; align-items: center; }
.scale { gap: 6px; }
.scale .bar { display: inline-block; height: 5px; border: 1.5px solid var(--text); border-top: 0; box-sizing: border-box; }
.legend { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--rule); padding-top: 8px; }
.legend-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.legend-title { font-family: var(--f-sc); font-size: 14px; letter-spacing: .04em; color: var(--muted); }
.legend-toggle { font-family: var(--f-sc); font-size: 14px; color: var(--muted); padding: 2px 4px; }
.legend-toggle:hover { color: var(--text); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; padding: 0; list-style: none; }
.swatches li { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; line-height: 1.3; }
.sw { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.ramp { height: 8px; border-radius: 1px; }
.ramp-scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend[data-collapsed="true"] .legend-body { display: none; }
#loading {
  display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
}
#loading .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--highlight); animation: blink 1s infinite ease-in-out; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- grape highlight pill ---------- */
.pill {
  position: absolute; z-index: 25; left: var(--gut-l); right: var(--gut-r); margin: 0 auto; width: max-content;
  top: var(--top); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 6px 6px 14px; max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--highlight); border-radius: 3px;
  font-size: var(--fs-sm);
  box-shadow: 0 6px 20px var(--shadow);
}
.pill b { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 17px; }
.pill > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill button { font-family: var(--f-sc); font-size: 14px; padding: 4px 8px; border-left: 1px solid var(--rule); color: var(--muted); }
.pill button:hover { color: var(--text); }

/* ---------- tooltip / toast ---------- */
#tip {
  position: absolute; z-index: 40; pointer-events: none;
  padding: 5px 9px 6px; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 2px;
  font-size: 14px; line-height: 1.25; max-width: 280px;
  box-shadow: 0 4px 14px var(--shadow);
  transform: translate(12px, 12px);
}
#tip .t-name { font-family: var(--f-display); font-style: italic; font-size: 17px; }
#tip .t-meta { font-family: var(--f-sc); font-size: 13px; color: var(--muted); letter-spacing: .03em; }
#toast {
  position: absolute; z-index: 60; left: 50%; bottom: calc(var(--bot) + 120px); transform: translateX(-50%);
  padding: 8px 14px; background: var(--text); color: var(--panel); border-radius: 2px; font-size: var(--fs-sm);
  max-width: calc(100% - 32px);
}

/* ---------- the sheet ---------- */
.sheet {
  position: absolute; z-index: 35;
  top: var(--top); bottom: var(--bot); right: var(--gut-r);
  width: var(--sheet-w); max-width: calc(100% - var(--gut-l) - var(--gut-r));
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--rule-strong);
  border-radius: 3px;
  box-shadow: 0 18px 50px var(--shadow);
  transform: translateX(0); transition: transform .38s var(--ease), opacity .25s;
}
.sheet[hidden] { display: flex !important; transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none; visibility: hidden; transition: transform .3s var(--ease), opacity .25s, visibility 0s .3s; }
.sheet-handle { display: none; }
.sheet-bar {
  flex: none; display: flex; align-items: center; gap: 4px;
  padding: 6px 6px 6px 8px; border-bottom: 1px solid var(--rule);
  min-height: 50px;
}
.sheet-bar .crumb { flex: 1; min-width: 0; font-family: var(--f-sc); font-size: 14px; color: var(--muted); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px 24px 40px; scroll-padding-top: 12px; }
.sheet-body > * + * { margin-top: 18px; }

/* reference-book typography */
.eyebrow { font-family: var(--f-sc); font-size: 15px; letter-spacing: .05em; color: var(--muted); line-height: 1.3; margin: 0; }
.eyebrow .sep { padding: 0 .35em; color: var(--faint); }
.title { font-family: var(--f-display); font-weight: 400; font-style: italic; font-size: var(--fs-xxl); line-height: 1.02; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.title.upright { font-style: normal; }
.alt { font-style: italic; color: var(--muted); font-size: 15px; margin-top: 6px !important; }
.tagline { font-family: var(--f-display); font-style: italic; font-size: var(--fs-md); line-height: 1.35; color: var(--text); margin: 8px 0 0; text-wrap: balance; }
.sheet-body > .head { margin-top: 0; }
.crumbs { font-size: 14.5px; color: var(--muted); line-height: 1.5; }
.crumbs a, .crumbs button { color: var(--accent); text-decoration: none; }
.crumbs a:hover, .crumbs button:hover { text-decoration: underline; }
.crumbs .gt { color: var(--faint); padding: 0 .3em; }
.crumbs .here { color: var(--text); }
.stack { border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; background: var(--panel-2); }
.stack-label { font-family: var(--f-sc); font-size: 13.5px; color: var(--muted); letter-spacing: .04em; display: block; margin-bottom: 2px; }
.stack .crumbs { font-size: 15px; }
.stack .also { margin: 6px 0 0; padding-top: 6px; border-top: 1px dashed var(--rule-strong); font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.stack .also a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--rule-strong); }
.stack .also a:hover { color: var(--accent); }
.stack .also .sep { padding: 0 .35em; color: var(--faint); }
.also-list { display: flex; flex-wrap: wrap; gap: 2px 0; line-height: 1.6; }
.also-list .sep { padding: 0 .5em; color: var(--faint); }
.also-list small { font-family: var(--f-sc); font-size: 12px; letter-spacing: .04em; color: var(--muted); margin-left: .35em; }
.ledger {
  display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 1px;
  background: var(--rule); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
  margin: 14px 0 0 !important;
}
.ledger.n1 { --cols: 1; } .ledger.n2 { --cols: 2; } .ledger.n3 { --cols: 3; } .ledger.n4 { --cols: 4; } .ledger.n5, .ledger.n6 { --cols: 3; }
.ledger > div { padding: 8px 10px 9px; min-width: 0; background: var(--panel); }
.ledger dt, .lk { font-family: var(--f-sc); font-size: 13.5px; color: var(--muted); letter-spacing: .04em; line-height: 1.2; display: block; }
.ledger dd .sec2 { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.ledger dd, .lv { margin: 3px 0 0; font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.3; overflow-wrap: break-word; }
.note { font-size: 14.5px; color: var(--muted); line-height: 1.5; }
.note b { color: var(--text); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 4px; min-height: 30px;
  border: 1px solid var(--rule-strong); border-radius: 2px; background: var(--panel);
  font-size: 14.5px; line-height: 1.2; color: var(--text); text-decoration: none;
}
a.chip:hover, button.chip:hover { border-color: var(--accent); }
.chip.static { cursor: default; }
.chip .sw { width: 9px; height: 9px; }
.sec { display: flex; align-items: center; gap: 10px; font-family: var(--f-sc); font-weight: 400; font-size: 16px; letter-spacing: .07em; color: var(--text); margin: 30px 0 0 !important; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--rule-strong); }
.sec + * { margin-top: 10px !important; }
.prose p { margin: 0 0 .8em; max-width: 65ch; hyphens: auto; -webkit-hyphens: auto; }
.prose p:last-child { margin-bottom: 0; }
.prose.lead > p:first-child::first-letter {
  initial-letter: 2;
  -webkit-initial-letter: 2;
  font-family: var(--f-display); color: var(--accent);
  margin-right: .1em;
}
@supports not ((initial-letter: 2) or (-webkit-initial-letter: 2)) {
  .prose.lead > p:first-child::first-letter { float: left; font-size: 3.1em; line-height: .78; margin: .08em .06em 0 0; padding: 0; }
}
.marg {
  border-left: 2px solid var(--highlight); padding: 2px 0 2px 14px;
  font-style: italic; font-size: 15.5px; color: var(--text);
}
.marg .lk { font-style: normal; margin-bottom: 3px; color: var(--highlight); }
.pending { font-style: italic; color: var(--muted); font-size: 15px; border-top: 1px dashed var(--rule-strong); border-bottom: 1px dashed var(--rule-strong); padding: 10px 0; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px 9px; min-height: 40px;
  border: 1px solid var(--accent); border-radius: 2px;
  font-family: var(--f-sc); font-size: 15.5px; letter-spacing: .04em; color: var(--accent);
}
.btn:hover { background: var(--accent); color: var(--accent-ink); }
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.solid:hover { filter: brightness(1.08); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--rule); }
.list li:first-child { border-top: 1px solid var(--rule); }
.row {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  padding: 9px 2px; color: var(--text); text-decoration: none; min-height: 44px;
}
.row:hover .row-name { color: var(--accent); }
.row-name { flex: 1; min-width: 0; font-size: 16px; line-height: 1.35; }
.row-name small { display: block; color: var(--muted); font-size: 13.5px; font-family: var(--f-sc); letter-spacing: .03em; }
.row-meta { flex: none; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dl { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 4px 14px; margin: 0; font-size: 14.5px; }
.dl dt { font-family: var(--f-sc); color: var(--muted); letter-spacing: .03em; }
.dl dd { margin: 0; font-family: var(--f-mono); font-size: 13.5px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.dl dd.txt { font-family: var(--f-body); font-size: 14.5px; }
.src { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.src a { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.latline { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.latline .coords { color: var(--text); }
.latline em { font-family: var(--f-body); font-size: 14.5px; }

details.wg > summary { list-style: none; border-bottom: 1px solid var(--rule); }
details.wg > summary::-webkit-details-marker { display: none; }
details.wg > summary .row-name::before { content: ""; display: inline-block; width: 0; height: 0; margin: 0 8px 2px 0; border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
details.wg[open] > summary .row-name::before { transform: rotate(90deg); }
details.wg .list li:first-child { border-top: 0; }

.regs li.sub .row { padding-left: 18px; min-height: 38px; }
.regs li.sub .row-name { font-size: 15px; }
.regs li.sub .row-name::before { content: "› "; color: var(--faint); }
.row-name small.tag { font-family: var(--f-body); letter-spacing: 0; font-size: 14px; font-style: italic; color: var(--muted); margin-top: 1px; }

/* climate block */
.clim { display: grid; gap: 12px; }
.gst-scale { position: relative; height: 96px; margin-top: 4px; }
.gst-bar { position: absolute; left: 0; right: 0; top: 36px; height: 10px; border-radius: 1px; }
.gst-ref { position: absolute; top: 29px; width: 1px; height: 7px; background: var(--muted); }
.gst-ref-l { position: absolute; font-size: 12px; color: var(--muted); white-space: nowrap; transform: translateX(-50%); line-height: 1.1; font-style: italic; }
.gst-ref-l.r0 { top: 0; }
.gst-ref-l.r1 { top: 14px; }
.gst-ref-l.al { transform: none; }
.gst-ref-l.ar { transform: translateX(-100%); }
.gst-mark { position: absolute; top: 46px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.gst-mark i { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid var(--text); }
.gst-mark b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--text); line-height: 1.3; white-space: nowrap; }
.gst-axis { position: absolute; left: 0; right: 0; top: 80px; display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
/* grapes list tools */
.gtools { display: grid; gap: 8px; }
.seg-inline { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
.seg-inline label { border-bottom: 0 !important; border-right: 1px solid var(--rule) !important; padding: 6px 4px; font-size: 14px; }
.seg-inline label:last-child { border-right: 0 !important; }

/* family tree */
.tree { display: grid; grid-template-columns: 1fr; gap: 6px; justify-items: center; text-align: center; }
.tree .gen { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
.tree .x { color: var(--faint); font-family: var(--f-mono); font-size: 13px; }
.tree .self { font-family: var(--f-display); font-style: italic; font-size: 22px; padding: 4px 14px; border: 1px solid var(--highlight); border-radius: 2px; }
.tree .stem { width: 1px; height: 14px; background: var(--rule-strong); }
.tree .gen-l { font-family: var(--f-sc); font-size: 12.5px; color: var(--muted); letter-spacing: .05em; }

/* history timeline inside country profile */
.hist { list-style: none; margin: 0; padding: 0 0 0 18px; position: relative; }
.hist::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }
.hist li { position: relative; padding: 0 0 16px; }
.hist li::before { content: ""; position: absolute; left: -18px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--accent); }
.hist .when { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
.hist .h-title { font-family: var(--f-display); font-style: italic; font-size: 19px; line-height: 1.2; display: block; text-align: left; }
.hist button.h-title:hover { color: var(--accent); }
.hist button.h-title .pin { font-style: normal; font-size: 12px; color: var(--muted); font-family: var(--f-mono); margin-left: 6px; }
.hist p { margin: 4px 0 0; font-size: 15px; line-height: 1.5; }
.hist li.abroad::before { border-style: dashed; border-color: var(--muted); }
.hist .away { margin-left: 8px; font-family: var(--f-sc); font-size: 13px; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--rule-strong); padding: 0 5px 1px; border-radius: 2px; }
.pref-note { font-size: 14.5px; color: var(--muted); border-left: 2px solid var(--highlight); padding: 2px 0 2px 12px; margin: 0 0 14px; }
.pref-note b { color: var(--text); font-weight: 500; }
.linkish { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; font-size: inherit; text-align: left; }

/* views */
.filter { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--rule-strong); border-radius: 2px; background: var(--panel-2); font-size: 16px; }
.filter:focus { outline: 2px solid var(--highlight); outline-offset: 0; }
.letter { font-family: var(--f-display); font-size: 26px; font-style: italic; color: var(--accent); margin: 18px 0 2px !important; border-bottom: 1px solid var(--rule-strong); }
.term { padding: 8px 0 10px; border-bottom: 1px solid var(--rule); }
.term h3 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 20px; line-height: 1.2; }
.term h3 small { font-family: var(--f-sc); font-style: normal; font-size: 13px; color: var(--muted); letter-spacing: .04em; margin-left: 6px; }
.term p { margin: 3px 0 0; font-size: 15.5px; }
.term .see { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; }
.chip.tag { font-family: var(--f-sc); font-size: 13.5px; letter-spacing: .04em; color: var(--muted); }
.term:target, .term.flash { background: color-mix(in srgb, var(--highlight) 12%, transparent); }
.toggles { display: grid; gap: 2px; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); min-height: 44px; cursor: pointer; }
.tog input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--rule-strong); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
.tog input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.tog input:checked { background: var(--accent); }
.tog input:checked::after { transform: translateX(16px); }
.tog input:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--rule-strong); border-radius: 2px; }
.seg label { position: relative; text-align: center; padding: 9px 6px; font-family: var(--f-sc); font-size: 15px; letter-spacing: .03em; cursor: pointer; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.seg label:nth-child(2n) { border-right: 0; }
.seg label:nth-last-child(-n+2) { border-bottom: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--highlight); outline-offset: -2px; }
.sys { border-top: 1px solid var(--rule-strong); padding-top: 12px; }
.ex { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.ex li { display: grid; gap: 1px; padding: 6px 0; border-top: 1px solid var(--rule); }
.ex .ex-p { text-align: left; color: var(--accent); font-size: 15.5px; text-decoration: none; }
.ex button.ex-p:hover, .ex a.ex-p:hover { text-decoration: underline; }
.ex .ex-c { font-family: var(--f-sc); font-size: 13px; letter-spacing: .04em; color: var(--muted); margin-left: 8px; }
.ex .ex-n { font-size: 14px; color: var(--muted); line-height: 1.45; }
.soil .prose p { font-size: 15.5px; }
.sys h3 { margin-top: 2px !important; }
.sys-more { margin-top: 10px; }
.sys-more summary { cursor: pointer; font-family: var(--f-sc); font-size: 14.5px; letter-spacing: .04em; color: var(--accent); padding: 4px 0; }
.sys-more h4 { margin: 12px 0 4px; font-family: var(--f-sc); font-weight: 400; font-size: 14.5px; letter-spacing: .05em; color: var(--muted); }
.sys-more .prose p { font-size: 15px; }
.ladder { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.ladder li { display: grid; gap: 2px; padding: 6px 10px; background: var(--panel-2); border-left: 3px solid var(--accent); font-size: 15px; }
.ladder li:nth-child(2) { border-left-color: color-mix(in srgb, var(--accent) 75%, var(--panel)); margin-left: 10px; }
.ladder li:nth-child(3) { border-left-color: color-mix(in srgb, var(--accent) 55%, var(--panel)); margin-left: 20px; }
.ladder li:nth-child(n+4) { border-left-color: color-mix(in srgb, var(--accent) 35%, var(--panel)); margin-left: 30px; }
.ladder b { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 17px; }
.ladder span { color: var(--muted); font-size: 14px; }

/* timeline: vertical list (sheet) */
.tl-list { list-style: none; margin: 0; padding: 0; }
.tl-era { font-family: var(--f-sc); font-size: 15px; letter-spacing: .06em; color: var(--accent); padding: 18px 0 4px; border-bottom: 1px solid var(--rule-strong); display: flex; justify-content: space-between; gap: 8px; }
.tl-era .mono { font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
.tl-ev { border-bottom: 1px solid var(--rule); }
.tl-ev > button { display: grid; grid-template-columns: 92px 1fr; gap: 10px; text-align: left; width: 100%; padding: 9px 0; align-items: baseline; }
.tl-ev .yr { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-ev .ttl { font-family: var(--f-display); font-style: italic; font-size: 18px; line-height: 1.2; }
.tl-ev[aria-current="true"] > button .ttl { color: var(--accent); }
.tl-ev[aria-current="true"] > button .yr { color: var(--highlight); }
.tl-ev .story { padding: 0 0 12px 102px; font-size: 15.5px; }
.tl-ev .story p { margin: 0 0 .6em; }
.tl-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* timeline: desktop strip */
.strip {
  position: absolute; z-index: 18;
  left: var(--gut-l); right: var(--gut-r); bottom: var(--bot);
  height: 196px;
  display: grid; grid-template-columns: 208px 1fr; grid-template-rows: auto 1fr;
  background: var(--panel-glass);
  border: 1px solid var(--rule-strong); border-radius: 3px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: right .35s var(--ease);
  overflow: hidden;
}
#app[data-sheet="open"] .strip { right: calc(var(--sheet-w) + var(--gut-r) + 12px); }
.strip-side { grid-row: 1 / 3; padding: 14px 14px 12px; border-right: 1px solid var(--rule-strong); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.strip-side h2 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 23px; line-height: 1.05; text-wrap: balance; }
.strip-side p { margin: 0; font-family: var(--f-sc); font-size: 13.5px; color: var(--muted); letter-spacing: .03em; line-height: 1.3; }
.strip-side .tl-controls { margin-top: auto; flex-wrap: nowrap; gap: 6px; }
.strip-side .btn { padding: 6px 10px 7px; min-height: 36px; font-size: 14.5px; flex: 1; justify-content: center; white-space: nowrap; }
.strip-side .icon-btn { border: 1px solid var(--rule-strong); color: var(--text); width: 36px; height: 36px; }
#app[data-strip="on"] .cartouche { display: none; }
#app[data-strip="on"] .ctl { bottom: calc(var(--bot) + 196px + 12px); }
.ribbon { position: relative; height: 26px; border-bottom: 1px solid var(--rule); margin: 0 14px; cursor: pointer; }
.ribbon:hover .tick { opacity: 1; }
.ribbon .tick { position: absolute; top: 6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--muted); opacity: .7; }
.ribbon .tick.on { background: var(--highlight); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--highlight) 30%, transparent); }
.ribbon .lab { position: absolute; top: 12px; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); transform: translateX(-50%); white-space: nowrap; }
.strip-scroll { overflow-x: auto; overflow-y: hidden; display: flex; align-items: stretch; gap: 0; padding: 0 0 0 0; scroll-behavior: smooth; overscroll-behavior-x: contain; scrollbar-width: thin; }
.s-era { display: flex; flex-direction: column; border-right: 1px solid var(--rule-strong); flex: none; }
.s-era-h { padding: 8px 14px 4px; font-family: var(--f-sc); font-size: 14px; letter-spacing: .05em; color: var(--accent); white-space: nowrap; display: flex; gap: 10px; align-items: baseline; }
.s-era-h .mono { font-size: 11px; color: var(--muted); letter-spacing: 0; }
.s-evs { display: flex; flex: 1; min-height: 0; }
.s-ev { width: 188px; flex: none; text-align: left; padding: 6px 14px 10px; border-top: 2px solid transparent; display: flex; flex-direction: column; gap: 3px; position: relative; }
.s-ev + .s-ev { border-left: 1px solid var(--rule); }
.s-ev:hover { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.s-ev .yr { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-ev .ttl { font-family: var(--f-display); font-style: italic; font-size: 17.5px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.s-ev .plc { font-family: var(--f-sc); font-size: 12.5px; color: var(--muted); letter-spacing: .03em; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-ev[aria-current="true"] { border-top-color: var(--highlight); background: var(--panel-2); }
.s-ev[aria-current="true"] .yr { color: var(--highlight); }
.s-ev .prog { position: absolute; left: 0; top: -2px; height: 2px; background: var(--accent); width: 0; }
.ev-story .when-big { font-family: var(--f-mono); font-size: 14px; color: var(--highlight); }

/* pulsing event marker */
.pulse { width: 18px; height: 18px; position: relative; pointer-events: none; }
.pulse i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--highlight); }
.pulse i:nth-child(1) { background: var(--highlight); transform: scale(.45); border: 0; box-shadow: 0 0 10px var(--highlight); }
.pulse i:nth-child(2), .pulse i:nth-child(3) { animation: pulse 2.4s infinite var(--ease); opacity: 0; }
.pulse i:nth-child(3) { animation-delay: 1.2s; }
@keyframes pulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(3.6); opacity: 0; } }
.pin-mark { width: 14px; height: 14px; border-radius: 50%; background: var(--highlight); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--highlight), 0 2px 8px var(--shadow); }

/* ---------- phone ---------- */
@media (max-width: 720px) {
  :root { --fs-xxl: 33px; --ctl: 42px; }
  .mast { width: auto; right: var(--gut-r); max-width: none; gap: 6px; }
  .views button { flex: 0 0 auto; padding: 7px 12px 8px; }
  .ctl { top: calc(var(--top) + 46px + 6px + 36px + 12px); bottom: auto; }
  #app[data-sheet="open"] .ctl { right: var(--gut-r); }
  #app[data-snap="full"] .ctl { opacity: 0; pointer-events: none; }
  .cartouche { padding: 10px 12px 8px; max-width: calc(100% - var(--gut-l) - var(--gut-r)); right: var(--gut-r); }
  .brand h1 { font-size: 26px; }
  .hint { font-size: 13px; }
  #app[data-active="true"] .hint { display: none; }
  .pill { top: auto; bottom: calc(var(--bot) + 8px); }
  #app[data-sheet="open"] .pill { bottom: calc(var(--sheet-h, 40vh) + 10px); }
  .sheet {
    left: 0; right: 0; top: auto; bottom: 0; width: auto; max-width: none;
    height: var(--sheet-h, 45vh);
    border-radius: 6px 6px 0 0; border-left: 0; border-right: 0; border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    box-shadow: 0 -10px 34px var(--shadow);
    transition: height .32s var(--ease), transform .32s var(--ease);
    will-change: transform;
  }
  .sheet[hidden] { transform: translateY(calc(100% + 20px)); }
  .sheet.dragging { transition: none; }
  .sheet-handle { display: block; flex: none; height: 22px; position: relative; touch-action: none; cursor: grab; }
  .sheet-handle::before { content: ""; position: absolute; left: 50%; top: 9px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--rule-strong); }
  .sheet-bar { min-height: 42px; padding: 0 6px 4px 10px; touch-action: none; }
  .sheet-body { padding: 14px var(--gut-r) 48px var(--gut-l); }
  .sec { margin-top: 26px !important; }
  .ledger.n4 { --cols: 2; }
  .ledger > div { padding: 7px 8px 8px; }
  .strip { display: none; }
  #toast { bottom: calc(var(--sheet-h, 0px) + var(--bot) + 16px); }
}
@media (max-width: 380px) {
  .views button { font-size: 14px; padding: 7px 10px 8px; }
  .brand .sub { display: none; }
}
@media (min-width: 721px) and (max-height: 700px) {
  .strip { height: 168px; }
  #app[data-strip="on"] .ctl { bottom: calc(var(--bot) + 168px + 12px); }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  .pulse i:nth-child(2) { opacity: .7; transform: scale(1.8); }
}

/* v2.css */
/* ---------- Vitis Mundi v2: shared pieces for the VM API and modules ---------- */
:root {
  /* extra tokens for v2 (light) */
  --ok: #3f7a4a;
  --warn: #b0661a;
  --bad: #a3303a;
  --cool: #2f64a8;
  --warm: #c24f2c;
  --overlay: rgba(251, 250, 247, .9);
  --img-bg: #e8e5dc;
  --map-halo-img: rgba(16, 18, 24, .82);  /* label halo over satellite imagery (both themes) */
  --map-label-img: #f6f1e4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ok: #79b884; --warn: #e5a052; --bad: #e0707a; --cool: #79a8e0; --warm: #ef8a62;
    --overlay: rgba(21, 26, 40, .9); --img-bg: #222839;
  }
}
:root[data-theme="dark"] {
  --ok: #79b884; --warn: #e5a052; --bad: #e0707a; --cool: #79a8e0; --warm: #ef8a62;
  --overlay: rgba(21, 26, 40, .9); --img-bg: #222839;
}

/* the nav row: scrolls sideways when modules add entries, with a soft fade at the hidden edge */
.views { position: relative; scroll-snap-type: x proximity; }
.views button { scroll-snap-align: start; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.views .nav-ic { display: inline-grid; place-items: center; width: 16px; height: 16px; }
.views .nav-ic svg { width: 16px; height: 16px; }
.views[data-ovr="1"] { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.views[data-ovl="1"][data-ovr="1"] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.views[data-ovl="1"][data-ovr="0"] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px); mask-image: linear-gradient(90deg, transparent, #000 28px); }

/* search in "pick" mode (VM.search.pick) */
.pickbar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 6px; padding: 6px 6px 6px 12px;
  background: var(--panel); border: 1px solid var(--highlight); border-radius: 3px;
  font-family: var(--f-sc); font-size: 14.5px; letter-spacing: .03em; color: var(--text);
}
.pickbar button { font-family: var(--f-sc); font-size: 14px; color: var(--muted); padding: 4px 8px; border-left: 1px solid var(--rule); }
.pickbar button:hover { color: var(--text); }
.search[data-pick] .search-box { border-color: var(--highlight); box-shadow: 0 0 0 2px color-mix(in srgb, var(--highlight) 25%, transparent); }

/* profile section slots filled by VM.panel.addSection */
.vm-slot:empty { display: none; }
.sheet-body > .vm-slot { margin-top: 0; }
.vm-slot > .vm-sec { margin-top: 18px; }
.vm-slot > .vm-sec[hidden] { display: none; }
.vm-slot[data-slot="hero"] > .vm-sec:first-child { margin-top: 14px; }

/* module building blocks (documented in frontend/API.md) */
.vm-card { border: 1px solid var(--rule-strong); border-radius: 2px; padding: 12px 14px; background: var(--panel); }
.vm-card + .vm-card { margin-top: 10px; }
.vm-card.alt { background: var(--panel-2); }
.vm-kv { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 4px 14px; margin: 0; font-size: 14.5px; }
.vm-kv dt { font-family: var(--f-sc); color: var(--muted); letter-spacing: .03em; }
.vm-kv dd { margin: 0; }
.vm-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vm-grow { flex: 1; min-width: 0; }
.vm-field { display: grid; gap: 4px; }
.vm-field > span { font-family: var(--f-sc); font-size: 13.5px; color: var(--muted); letter-spacing: .04em; }
.vm-input, .vm-select, .vm-textarea {
  box-sizing: border-box; max-width: 100%;
  width: 100%; min-height: 42px; padding: 8px 12px;
  border: 1px solid var(--rule-strong); border-radius: 2px; background: var(--panel-2);
  font-family: var(--f-body); font-size: 16px; color: var(--text);
}
.vm-textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.vm-input:focus, .vm-select:focus, .vm-textarea:focus { outline: 2px solid var(--highlight); outline-offset: 0; }
.vm-range { box-sizing: border-box; width: 100%; max-width: 100%; accent-color: var(--accent); min-height: 28px; }
.vm-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; }
.vm-tabs::-webkit-scrollbar { display: none; }
.vm-tabs button { flex: none; padding: 8px 12px; font-family: var(--f-sc); font-size: 15px; letter-spacing: .03em; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.vm-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.vm-empty { font-style: italic; color: var(--muted); font-size: 15px; padding: 10px 0; border-top: 1px dashed var(--rule-strong); border-bottom: 1px dashed var(--rule-strong); }
.vm-badge { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 1px; border: 1px solid var(--rule-strong); border-radius: 2px; font-family: var(--f-sc); font-size: 12.5px; letter-spacing: .04em; color: var(--muted); line-height: 1.5; }
.vm-badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.vm-badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.vm-num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.vm-stars { color: var(--highlight); letter-spacing: .1em; }
.btn.ghost { border-color: var(--rule-strong); color: var(--text); }
.btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.btn.small { min-height: 32px; padding: 4px 10px 5px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- v2 map chrome: base map popover, 3D controls, attribution, dock ---------- */
#bm-btn[data-base="satellite"] { color: var(--highlight); }
#bm-btn[data-base="topo"] { color: var(--highlight); }
.bmpop {
  position: absolute; z-index: 33; box-sizing: border-box;
  right: calc(var(--gut-r) + var(--ctl) + 10px); bottom: calc(var(--bot) + 4px);
  width: 288px; max-width: calc(100% - var(--gut-l) - var(--gut-r) - var(--ctl) - 10px);
  max-height: calc(100% - var(--top) - var(--bot) - 8px); overflow-y: auto; overscroll-behavior: contain;
  padding: 12px 14px 12px; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 3px;
  box-shadow: 0 12px 34px var(--shadow);
  transition: right .35s var(--ease);
}
#app[data-sheet="open"] .bmpop { right: calc(var(--sheet-w) + var(--gut-r) + 12px + var(--ctl) + 10px); }
.bm-h { margin: 0 0 8px; font-family: var(--f-sc); font-size: 14.5px; letter-spacing: .05em; color: var(--muted); }
.bm-bases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.bm-base { position: relative; display: grid; gap: 4px; justify-items: center; cursor: pointer; padding: 4px 2px 5px; border: 1px solid var(--rule); border-radius: 2px; }
.bm-base input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.bm-base:has(input:checked) { border-color: var(--highlight); background: var(--panel-2); }
.bm-base:has(input:focus-visible) { outline: 2px solid var(--highlight); outline-offset: 1px; }
.bm-sw { width: 100%; height: 38px; border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.bm-sw-standard { background: radial-gradient(70% 90% at 30% 40%, var(--land-wine) 0 45%, var(--ocean) 46%); }
.bm-sw-satellite { background: radial-gradient(40% 50% at 30% 35%, #6f7a3e, transparent 70%), radial-gradient(45% 55% at 75% 70%, #8a7550, transparent 70%), linear-gradient(135deg, #2f4a2c, #4c5a33 45%, #253d52 46%, #1c3247); }
.bm-sw-topo { background: repeating-radial-gradient(circle at 60% 55%, #efe8d4 0 4px, #c9a77d 4px 5px), #efe8d4; }
.bm-l { font-family: var(--f-sc); font-size: 13.5px; letter-spacing: .02em; line-height: 1.1; }
.bm-togs { margin-top: 8px; }
.bm-togs .tog { min-height: 42px; padding: 6px 0; }
.tog small { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.bm-exag { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 10px; padding: 4px 0 8px; border-bottom: 1px solid var(--rule); }
.bm-exag label { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.bm-exag .mono { font-size: 12.5px; color: var(--text); min-width: 3.2em; text-align: right; }
.bm-go { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bm-go .btn { flex: 1 1 auto; justify-content: center; }
.bm-go .btn svg { flex: none; }
.bm-section .bm-bases { margin-top: 10px; }

.attrib {
  position: absolute; z-index: 16;
  right: var(--gut-r); bottom: calc(var(--bot) + var(--ctl-h, 0px) + 10px);
  max-width: min(360px, 42%);
  padding: 3px 7px 4px; background: var(--panel-glass); border: 1px solid var(--rule); border-radius: 2px;
  font-size: 11.5px; line-height: 1.4; color: var(--muted); text-align: right;
  transition: right .35s var(--ease);
}
.attrib a { color: var(--muted); text-decoration: none; }
.attrib a:hover { color: var(--text); text-decoration: underline; }
.attr-more { font-size: 12px; color: var(--muted); padding: 0 2px; vertical-align: baseline; }
#app[data-sheet="open"] .attrib { right: calc(var(--sheet-w) + var(--gut-r) + 12px); }

.dock {
  position: absolute; z-index: 19; box-sizing: border-box;
  left: var(--gut-l); bottom: var(--bot);
  width: min(560px, calc(100% - var(--gut-l) - var(--gut-r) - var(--ctl) - 24px));
  padding: 10px 14px 12px; display: grid; gap: 8px;
  background: var(--panel-glass); border: 1px solid var(--rule-strong); border-radius: 3px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px var(--shadow);
}
#app[data-dock] .cartouche { display: none; }
.dock > * { min-width: 0; }
.dk-cap { overflow: hidden; }
#app[data-dock][data-sheet="open"] .dock { width: min(560px, calc(100% - var(--gut-l) - var(--sheet-w) - var(--gut-r) - var(--ctl) - 36px)); }
.dk-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dk-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-sc); font-size: 14.5px; letter-spacing: .04em; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.dk-eyebrow svg { flex: none; color: var(--highlight); }
.dk-place { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dk-x { width: 34px; height: 34px; margin: -4px -6px -4px 0; }
.dk-read { margin: 0; font-size: 14.5px; line-height: 1.4; min-height: 2.8em; }
.dk-read b { font-weight: 500; }
.dk-sliders { display: grid; gap: 4px; }
.dk-sl { display: grid; grid-template-columns: 76px 1fr 54px; align-items: center; gap: 8px; }
.dk-sl > span { font-family: var(--f-sc); font-size: 13.5px; color: var(--muted); letter-spacing: .03em; }
.dk-sl b { font-weight: 500; font-size: 13px; text-align: right; }
.sun-t { --day-a: 25%; --day-b: 75%; }
.sun-t::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--rule-strong) 0 var(--day-a), color-mix(in srgb, var(--highlight) 75%, transparent) var(--day-a) var(--day-b), var(--rule-strong) var(--day-b)); }
.sun-t::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--rule-strong) 0 var(--day-a), color-mix(in srgb, var(--highlight) 75%, transparent) var(--day-a) var(--day-b), var(--rule-strong) var(--day-b)); }
.sun-t::-webkit-slider-thumb { margin-top: -6px; }
.dk-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dk-grow { flex: 1; min-width: 120px; }
.dk-sel { flex: 1; min-width: 0; min-height: 36px; padding: 4px 8px; font-size: 15px; }
.dk-note { margin: 0; font-size: 13.5px; color: var(--muted); font-style: italic; line-height: 1.45; }
.dk-cap { min-height: 64px; }
.dk-ctx { margin: 0; font-family: var(--f-sc); font-size: 13.5px; letter-spacing: .04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dk-title { margin: 1px 0 0; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 25px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dk-title a { color: inherit; text-decoration: none; }
.dk-title a:hover { color: var(--accent); }
.dk-chips { margin-top: 6px !important; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.dk-chips::-webkit-scrollbar { display: none; }
.dk-chips .chip { white-space: nowrap; min-height: 28px; font-size: 14px; }
.jr-ctl .btn { min-width: 76px; justify-content: center; }
.jr-list .jr-t { font-family: var(--f-body); letter-spacing: 0; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
#app[data-capture] .maplibregl-canvas { cursor: crosshair; }

@media (max-width: 720px) {
  .bmpop { top: calc(var(--top) + 46px + 6px + 36px + 12px); bottom: auto; left: var(--gut-l); right: calc(var(--gut-r) + var(--ctl) + 8px); width: auto; max-width: none; max-height: calc(100% - var(--top) - 120px - var(--bot)); }
  #app[data-sheet="open"] .bmpop { right: calc(var(--gut-r) + var(--ctl) + 8px); }
  .attrib { left: var(--gut-l); right: var(--gut-r); max-width: none; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; bottom: 8px; }
  #app[data-sheet="open"] .attrib { right: var(--gut-r); }
  .attrib.open { white-space: normal; }
  .dock {
    left: 0; right: 0; bottom: 0; width: auto;
    padding: 10px var(--gut-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gut-l);
    border-radius: 6px 6px 0 0; border-left: 0; border-right: 0; border-bottom: 0;
  }
  #app[data-dock] .pill { bottom: calc(var(--dock-h, 180px) + 10px); }
  .dk-title { font-size: 22px; }
  .dk-sl { grid-template-columns: 64px 1fr 50px; }
}

/* ---------- v2 profile sections ---------- */
/* photos: the box keeps its ratio before the image arrives, so nothing jumps */
.vm-sec .ph { margin: 0; }
.ph-hero { width: 100%; overflow: hidden; background: var(--img-bg); border-radius: 2px; }
.ph-hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph-cap { margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--muted); }
.ph-cap a { color: var(--muted); }
.ph-by { font-family: var(--f-body); }
.ph-gal { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ph-th { display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 2px; background: var(--img-bg); opacity: .7; outline-offset: 1px; }
.ph-th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-th.on, .ph-th:hover { opacity: 1; box-shadow: 0 0 0 2px var(--highlight); }

/* terrain */
.tr { display: flex; gap: 16px; align-items: center; margin-top: 10px !important; }
.tr-rose { margin: 0; flex: none; display: grid; justify-items: center; gap: 2px; }
.tr-rose figcaption { font-size: 12.5px; color: var(--muted); font-family: var(--f-sc); letter-spacing: .03em; }
.tr-k { flex: 1; min-width: 0; }
.tr-led { --cols: 1 !important; margin: 0 !important; }
.rose-g { fill: none; stroke: var(--rule-strong); stroke-width: .8; }
.rose-p { fill: color-mix(in srgb, var(--accent) 62%, transparent); stroke: var(--panel); stroke-width: 1; }
.rose-a { stroke: var(--highlight); stroke-width: 1.6; }
.rose-ad { fill: var(--highlight); }
.rose-l { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); text-anchor: middle; }
.tr-read { margin-top: 10px !important; color: var(--text); font-size: 15px; }
@media (max-width: 380px) { .tr { flex-direction: column; align-items: stretch; } .tr-rose { justify-self: center; } }

/* vintage strip */
.vt { position: relative; margin-top: 10px !important; padding-top: 16px; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.vt:focus-visible { outline: 2px solid var(--highlight); outline-offset: 4px; }
.vt svg { display: block; width: 100%; }
.vt-gst { height: 64px; }
.vt-row { height: 14px; }
.vt-lab { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0 1px; font-family: var(--f-sc); font-size: 12px; letter-spacing: .04em; color: var(--muted); line-height: 1.2; }
.vt-lab .mono { font-size: 10.5px; letter-spacing: 0; }
.vt-0 { stroke: var(--rule-strong); stroke-width: .6; vector-effect: non-scaling-stroke; }
.vt-w { fill: var(--warm); }
.vt-c { fill: var(--cool); }
.vt-r { fill: color-mix(in srgb, var(--river-wine) 80%, transparent); }
.vt-f { fill: color-mix(in srgb, var(--cool) 75%, var(--panel)); }
.vt-h { fill: color-mix(in srgb, var(--warm) 85%, transparent); }
.vt-ev { position: absolute; left: 0; right: 0; top: 0; height: 14px; }
.vt-m { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 1px; align-items: center; }
.vt-m .ek { width: 5px; height: 5px; }
.vt-axis { position: relative; height: 16px; margin-top: 3px; font-size: 10.5px; color: var(--faint); }
.vt-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.vt-cur { position: absolute; top: 12px; bottom: 16px; width: 0; border-left: 1.5px solid var(--text); pointer-events: none; transform: translateX(-.75px); opacity: .8; }
.ek { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.ek-frost { background: var(--cool); border-radius: 1px; transform: rotate(45deg) scale(.85); }
.ek-hail { background: var(--muted); border-radius: 1px; }
.ek-heat { background: var(--warm); }
.ek-drought { background: var(--warn); border-radius: 1px; }
.ek-rain, .ek-flood { background: var(--river-wine); }
.ek-fire, .ek-smoke { background: var(--bad); border-radius: 1px; transform: rotate(45deg) scale(.85); }
.ek-great { background: none; box-shadow: inset 0 0 0 2px var(--highlight); }
.ek-cool { background: none; box-shadow: inset 0 0 0 1.5px var(--cool); }
.ek-mildew { background: var(--ok); }
.vt-detail { margin-top: 8px !important; min-height: 3.2em; }
.vt-yr { margin: 0; font-size: 14.5px; line-height: 1.5; }
.vt-year { font-family: var(--f-display); font-style: italic; font-size: 22px; margin-right: 4px; vertical-align: -1px; }
.vt-yr b { font-weight: 500; }
.vt-tw { color: var(--warm); } .vt-tc { color: var(--cool); }
.vt-note { margin: 6px 0 0; font-size: 14.5px; line-height: 1.5; padding-left: 10px; border-left: 2px solid var(--rule-strong); }
.vt-kind { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-sc); font-size: 13px; letter-spacing: .04em; color: var(--muted); margin-right: 4px; }
.vt-from { font-family: var(--f-body); letter-spacing: 0; font-style: italic; }
.vt-src { font-size: 13px; color: var(--muted); }
.vt-evy { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 10px !important; }
.vt-evy .lk { width: 100%; margin-bottom: 2px; }
.vt-y { min-height: 30px; padding: 2px 8px 3px; font-family: var(--f-mono); font-size: 13px; gap: 3px; }
.vt-y .ek { width: 6px; height: 6px; }
.vt-y[aria-pressed="true"] { border-color: var(--highlight); background: var(--panel-2); }
.vt-inh a { color: var(--accent); }

/* climate drift */
.dr { position: relative; height: 62px; margin-top: 12px !important; }
.dr-bar { position: absolute; left: 0; right: 0; top: 22px; height: 6px; border-radius: 1px; opacity: .55; }
.dr-arrow { position: absolute; top: 24px; height: 2px; background: var(--text); }
.dr-arrow::after { content: ""; position: absolute; right: -2px; top: -4px; border-left: 7px solid var(--text); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.dr-pt { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; line-height: 1.15; }
.dr-pt i { order: 2; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--text); margin: 3px 0; }
.dr-pt b { order: 1; font-weight: 500; font-size: 12.5px; white-space: nowrap; }
.dr-pt small { order: 3; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.dr-pt.p1 b, .dr-pt.p1 small { visibility: hidden; }
.dr-pt.p1 i { width: 7px; height: 7px; border-color: var(--muted); margin: 4px 0; }
.dr-pt.p1 { top: 0; }
.dr-pt.p2 i { background: var(--warm); border-color: var(--warm); }
.dr-twin { margin: 12px 0 0; font-size: 15px; line-height: 1.5; border-left: 2px solid var(--highlight); padding: 1px 0 1px 12px; }
.dr-twin .lk { color: var(--highlight); margin-bottom: 2px; }
.dr-twin small { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.dr-twin.rev { border-left-color: var(--rule-strong); }
.dr-twin.rev .lk { color: var(--muted); }

/* rules */
.rg-dl { grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 14px; }
.rg-dl dd.txt { font-size: 15px; line-height: 1.45; }
.rg-nat { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 6px; }
.rg-nat summary { cursor: pointer; font-family: var(--f-sc); font-size: 14.5px; letter-spacing: .04em; color: var(--accent); padding: 4px 0; }
.rg-nat .dl { margin-top: 8px; }
@media (max-width: 420px) { .rg-dl { grid-template-columns: 1fr; gap: 0; } .rg-dl dt { margin-top: 8px; } }
.dr-arrow.neg::after { right: auto; left: -2px; border-left: 0; border-right: 7px solid var(--text); }

/* modules/20_journal.css */
/* ---------- cellar journal (modules/20_journal.js) ---------- */
#sheet-body[data-view="journal"] > * + * { margin-top: 16px; }
#sheet-body[data-view="journal"] .sw, .jr-sec .sw { display: inline-block; vertical-align: 1px; }
/* the shared .vm-input / .filter are width:100% with padding: keep them inside the sheet */
#sheet-body[data-view="journal"] *, #sheet-body[data-view="journal"] *::before, #sheet-body[data-view="journal"] *::after, .jr-sec * { box-sizing: border-box; }
.jr-tabs[data-ovr="1"] { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.jr-tabs[data-ovl="1"][data-ovr="1"] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 28px), transparent); }
.jr-tabs[data-ovl="1"][data-ovr="0"] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); }
#sheet-body[data-view="journal"] a.btn { text-decoration: none; }
.jr-muted { color: var(--muted); font-style: italic; }
.jr-err { color: var(--bad); font-size: 14.5px; margin: 0; }
.jr-hint { font-size: 13px; color: var(--muted); font-style: italic; margin: 6px 0 0; line-height: 1.4; }
.jr-lk { font-family: var(--f-sc); font-size: 13.5px; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
.jr-empty { margin-top: 14px !important; }
.jr-off { font-size: 16px; }

/* account line */
.jr-acct { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 15px; line-height: 1.35; }
.jr-acct small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 1px; }
.jr-acct b { font-weight: 500; overflow-wrap: anywhere; }
.jr-acct-col { flex-direction: column; align-items: stretch; gap: 10px; }
.jr-acct-col > * { margin: 0; }
.jr-acct-p { margin: 0; }
.jr-acct-note { margin-top: 10px !important; }
.jr-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }

.jr-dot.warn { background: var(--warn); }
.jr-code { display: flex; align-items: flex-end; gap: 8px; }

.jr-offer p { margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
.jr-offer b { font-weight: 500; }

.jr-first .jr-lk { margin-bottom: 8px; }
.jr-acct + .jr-first { border-top: 0; padding-top: 0; margin-top: 14px !important; }
.jr-steps { margin: 0; padding: 0; list-style: none; counter-reset: jr; display: grid; gap: 8px; }
.jr-steps li { counter-increment: jr; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 15px; line-height: 1.45; }
.jr-steps li::before { content: counter(jr); font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); padding-top: 2px; }
.jr-steps b { font-weight: 500; }
.jr-first .note { margin: 10px 0 0; }
.jr-addrow .btn svg { margin-right: -2px; }
.jr-tabs { margin-top: 18px !important; }
.jr-tabs .vm-num { font-size: 12px; color: var(--muted); margin-left: 3px; }
.jr-panel > * + * { margin-top: 12px; }

/* bottle rows */
.jr-row { align-items: center; gap: 12px; }
.jr-thumb { flex: none; width: 34px; height: 46px; border-radius: 2px; overflow: hidden; position: relative;
  background: color-mix(in srgb, var(--sw, var(--w-mixed)) 12%, var(--panel-2)); border-left: 3px solid var(--sw, var(--w-mixed)); }
.jr-thumb > svg { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; color: var(--sw, var(--w-mixed)); opacity: .55; }
.jr-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.jr-thumb img.on { opacity: 1; }
.jr-thumb img.none { display: none; }
.jr-vint { font-size: 13px; color: var(--muted); white-space: nowrap; }
.jr-row .row-meta { font-size: 14px; color: var(--text); }
.jr-year { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 0; padding-bottom: 3px; font-family: var(--f-sc); font-weight: 400; font-size: 15px; letter-spacing: .06em; color: var(--accent); border-bottom: 1px solid var(--rule-strong); }

.jr-excerpt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; color: var(--text); margin-top: 2px; line-height: 1.4; }
.jr-chiplist { margin-top: 10px !important; }
.jr-foot { margin-top: 30px !important; }
.jr-foot .tog span small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.jr-foot .btn-row { margin-top: 10px; }
.jr-foot .src { margin-top: 12px; }
.jr-file { position: relative; cursor: pointer; }
.jr-file:focus-within { outline: 2px solid var(--highlight); outline-offset: 2px; }

/* the bottle card */
.jr-btitle .jr-tv { font-family: var(--f-mono); font-style: normal; font-size: .52em; color: var(--muted); letter-spacing: 0; vertical-align: .18em; white-space: nowrap; }
.jr-class { font-size: 17px !important; }
.jr-photo-big { margin: 16px 0 0; border: 1px solid var(--rule); background: var(--img-bg); }
.jr-photo-big img { display: block; width: 100%; max-height: 380px; object-fit: contain; opacity: 0; }
.jr-photo-big img.on { opacity: 1; }
.jr-photo-big:has(img.none) { display: none; }
.jr-facts { margin-top: 16px !important; }
.jr-facts dd { font-size: 15px; }
.jr-notes-prose p { font-size: 16px; }
.jr-satsum { grid-template-columns: minmax(84px, auto) 1fr; }
.jr-satsum dd { font-size: 15px; line-height: 1.45; }
.jr-cardacts { margin-top: 24px !important; }
.jr-cardacts .btn svg { margin-right: -2px; }
.jr-meta { margin-top: 18px !important; }
.jr-del { color: var(--muted); font-size: inherit; }
.jr-del[data-armed="1"] { color: var(--bad); }

/* the form */
.jr-form > * + * { margin-top: 16px; }
.jr-form .head { margin-bottom: 4px; }
.jr-form .vm-field > span i { font-family: var(--f-body); font-size: 13px; letter-spacing: 0; color: var(--faint); }
.jr-form:not([data-status="tasted"]) [data-for="tasted"] { display: none; }
[data-for="tasted"] > * + * { margin-top: 16px; }
.jr-seg3 { grid-template-columns: repeat(3, 1fr); }
.jr-seg3 label { border-bottom: 0 !important; border-right: 1px solid var(--rule) !important; }
.jr-seg3 label:last-child { border-right: 0 !important; }
.jr-vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; }
.jr-check { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; font-size: 15px; cursor: pointer; }
.jr-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.jr-2col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.jr-pickrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 42px; }

.jr-picked-place { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.jr-pp-name { font-family: var(--f-display); font-style: italic; font-size: 20px; line-height: 1.15; color: var(--text); text-decoration: none; }
.jr-picked-place small { font-family: var(--f-sc); font-size: 13px; letter-spacing: .03em; color: var(--muted); }
.jr-pickrow .icon-btn { font-size: 20px; line-height: 1; }
.jr-country select { max-width: 100%; }
.jr-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.jr-pills button { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 3px 11px 4px; border: 1px solid var(--rule-strong); border-radius: 2px; background: var(--panel); font-size: 14.5px; line-height: 1.2; color: var(--text); }
.jr-pills button:hover { border-color: var(--accent); }
.jr-pills button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.jr-pills button[aria-checked="true"] .sw { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.jr-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.jr-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 2px 10px 3px; border: 1px solid var(--rule-strong); border-radius: 2px; background: var(--panel); font-size: 14px; line-height: 1.2; color: var(--text); text-decoration: none; }
.jr-chip:hover { border-color: var(--accent); }
.jr-chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.jr-chip[aria-pressed="true"]::before { content: ""; width: 7px; height: 3.5px; border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg) translate(1px, -1px); }

.jr-scale { position: relative; height: 15px; font-size: 11px; color: var(--faint); }

/* collapsible groups */
