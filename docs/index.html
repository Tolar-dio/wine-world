.jr-more > summary, .jr-sat > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 22px 12px 0; position: relative; font-family: var(--f-sc); font-size: 16px; letter-spacing: .05em; }
.jr-more > summary small, .jr-sat > summary small { display: block; font-family: var(--f-body); font-style: italic; font-size: 13.5px; letter-spacing: 0; color: var(--muted); }
.jr-more > summary::after, .jr-sat > summary::after, .jr-tier > summary::after { content: ""; position: absolute; right: 4px; top: 19px; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.jr-more[open] > summary::after, .jr-sat[open] > summary::after, .jr-tier[open] > summary::after { transform: rotate(-135deg); top: 22px; }
.jr-more > summary:hover, .jr-sat > summary:hover { color: var(--accent); }
.jr-satn { font-size: 12.5px; color: var(--accent); letter-spacing: 0; }
.jr-more > *:not(summary) + *, .jr-more > summary + * { margin-top: 12px; }
.jr-more { padding-bottom: 6px; }
.jr-satg { border: 0; padding: 0; margin: 10px 0 0; min-width: 0; }
.jr-satg legend { padding: 0; margin: 0 0 4px; font-family: var(--f-display); font-style: italic; font-size: 20px; color: var(--text); }
.jr-satrow { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--rule); }
.jr-satrow-col { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.jr-satl { font-family: var(--f-sc); font-size: 14px; letter-spacing: .03em; color: var(--muted); line-height: 1.25; }
.jr-satrow .jr-pills button { min-height: 34px; padding: 2px 9px 3px; font-size: 14px; }
.jr-same { font-family: var(--f-body); font-size: 13.5px; letter-spacing: 0; margin-left: 8px; }
.jr-aromas { display: grid; gap: 6px; }
.jr-tier { border: 1px solid var(--rule); border-radius: 2px; }
.jr-tier > summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 28px 8px 10px; position: relative; min-height: 40px; }
.jr-tier > summary::after { top: 15px; right: 10px; }
.jr-tier[open] > summary::after { top: 18px; }
.jr-tier > summary > span:first-child { font-size: 15px; }
.jr-tier > summary small { margin-left: 6px; font-family: var(--f-sc); font-size: 12.5px; letter-spacing: .04em; color: var(--muted); }
.jr-picked { font-style: italic; font-size: 14px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.jr-tier[open] { padding-bottom: 10px; }
.jr-agroup { display: grid; gap: 5px; padding: 6px 10px 0; }
.jr-agl { font-family: var(--f-sc); font-size: 13px; letter-spacing: .04em; color: var(--muted); }

/* the sticky save bar */
.jr-savebar { position: sticky; bottom: -40px; z-index: 3; display: flex; gap: 8px; align-items: center;
  margin: 22px -24px -40px !important; padding: 12px 24px 14px; background: var(--panel); border-top: 1px solid var(--rule-strong); }
.jr-savebar .btn { justify-content: center; }
.jr-savebar .btn.solid { flex: 1; max-width: 240px; }

/* profile sections: lists and note */
.vm-sec.jr-sec { margin-top: 12px; }
.jr-strip { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 0 2px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.jr-strip::-webkit-scrollbar { display: none; }
.jr-strip[data-ovr="1"] { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.jr-strip[data-ovl="1"][data-ovr="1"] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 28px), transparent); }
.jr-strip[data-ovl="1"][data-ovr="0"] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); }
.jr-tg { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 0 8px; border: 0; background: none; font-family: var(--f-sc); font-size: 14.5px; letter-spacing: .03em; line-height: 1.1; color: var(--muted); text-decoration: none; white-space: nowrap; }
.jr-tg:first-child { padding-left: 2px; }
.jr-tg:hover { color: var(--text); }
.jr-tg[aria-pressed="true"] { color: var(--text); }
.jr-tg[aria-pressed="true"]::before { content: ""; width: 7px; height: 3.5px; border-left: 1.6px solid var(--highlight); border-bottom: 1.6px solid var(--highlight); transform: rotate(-45deg) translate(1px, -1px); }
.jr-tg + .jr-tg { position: relative; }
.jr-tg + .jr-tg::after { content: ""; position: absolute; left: -1px; top: 13px; bottom: 13px; width: 1px; background: var(--rule); }
.jr-tg-add { color: var(--accent); }
.jr-tg-add:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.jr-tg svg { width: 11px; height: 11px; }
.jr-noteed { margin-top: 10px; display: grid; gap: 3px; }
.jr-nl { font-family: var(--f-sc); font-size: 13.5px; letter-spacing: .04em; color: var(--muted); }
.jr-nta { width: 100%; min-height: 44px; resize: none; overflow: hidden; padding: 7px 10px; border: 0; border-left: 2px solid var(--highlight); border-radius: 0; background: color-mix(in srgb, var(--highlight) 7%, transparent); font-family: var(--f-body); font-size: 15.5px; line-height: 1.5; color: var(--text); }
.jr-nta::placeholder { color: var(--muted); font-style: italic; opacity: 1; }
.jr-nta:focus { outline: 2px solid var(--highlight); outline-offset: 0; }
.jr-nst { min-height: 1.2em; font-family: var(--f-sc); font-size: 12.5px; letter-spacing: .04em; color: var(--faint); }
.jr-more-link { margin-top: 6px !important; }

/* passport */
.jr-pass > * + * { margin-top: 14px; }
.jr-world { margin-top: 16px !important; }
.jr-world svg { display: block; width: 100%; height: auto; background: var(--ocean); border: 1px solid var(--rule); }
.jr-world path { fill: var(--land); stroke: var(--rule-strong); stroke-width: .25; stroke-linejoin: round; }
.jr-world path.wine { fill: var(--land-wine); }
.jr-world path.some { fill: color-mix(in srgb, var(--accent) 50%, var(--land-wine)); }
.jr-world path.on { fill: var(--accent); stroke: var(--panel); }
.jr-world-ph { aspect-ratio: 360 / 142; background: color-mix(in srgb, var(--ocean) 75%, var(--panel)); border: 1px solid var(--rule); }
.jr-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.jr-legend span { display: inline-flex; align-items: center; gap: 6px; }
.jr-legend i { width: 10px; height: 10px; border: 1px solid var(--rule-strong); background: var(--land); }
.jr-legend i.on { background: var(--accent); border-color: var(--accent); }
.jr-legend i.some { background: color-mix(in srgb, var(--accent) 50%, var(--land-wine)); }
.jr-legend i.wine { background: var(--land-wine); }
.jr-hbars { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.jr-hbars li { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 4.2em; gap: 10px; align-items: center; min-height: 28px; font-size: 14.5px; }
.jr-hb-l { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); text-decoration: none; }
a.jr-hb-l:hover { color: var(--accent); }
.jr-hb-b { height: 8px; background: color-mix(in srgb, var(--text) 6%, transparent); }
.jr-hb-b i { display: block; height: 100%; min-width: 3px; background: var(--accent); border-radius: 0 2px 2px 0; }
.jr-hb-n { text-align: right; font-size: 13.5px; line-height: 1.1; }
.jr-hb-n small { display: block; font-size: 10.5px; color: var(--muted); }
.jr-countries { margin-top: 12px !important; }
.jr-stamps .chip { font-size: 14px; min-height: 30px; }
.jr-chart-sub { margin-top: 6px !important; }
.jr-bars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 118px; margin: 12px 0 26px !important; border-bottom: 1px solid var(--rule-strong); }
.jr-bar { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
.jr-bar i { display: block; width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; }
.jr-bar span { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.jr-bar:first-child span { left: 0; transform: none; }
.jr-bar:last-child span { left: auto; right: 0; transform: none; }
.jr-bar:hover i { filter: brightness(1.12); }
.jr-bar:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); z-index: 2; padding: 2px 7px 3px; background: var(--text); color: var(--panel); border-radius: 2px; font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; pointer-events: none; }
.jr-bar:first-child:hover::after { left: 0; transform: none; }
.jr-bar:last-child:hover::after { left: auto; right: 0; transform: none; }
.jr-classics { margin-top: 8px !important; }
.jr-classic { border-top: 1px solid var(--rule); }
.jr-classic:last-child { border-bottom: 1px solid var(--rule); }
.jr-classic > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px 0 11px; }
.jr-classic > summary:hover .jr-cl-t { color: var(--accent); }
.jr-cl-t { font-size: 16px; line-height: 1.3; }
.jr-cl-t small { display: block; font-size: 13.5px; font-style: italic; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.jr-cl-n { font-size: 15px; }
.jr-cl-n span { color: var(--muted); font-size: 12.5px; }
.jr-prog { grid-column: 1 / -1; position: relative; height: 4px; background: color-mix(in srgb, var(--text) 7%, transparent); }
.jr-prog i, .jr-prog b { position: absolute; top: 0; bottom: 0; left: 0; }
.jr-prog i { background: var(--accent); }
.jr-prog b { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.jr-members { list-style: none; margin: 2px 0 0; padding: 0 0 10px; columns: 2; column-gap: 18px; }
.jr-members li { break-inside: avoid; }
.jr-members a { display: flex; align-items: baseline; gap: 7px; padding: 4px 0; font-size: 14.5px; line-height: 1.3; color: var(--muted); text-decoration: none; }
.jr-members a:hover { color: var(--accent); }
.jr-members small { margin-left: auto; padding-left: 4px; font-size: 10.5px; color: var(--faint); }
.jr-mk { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.3px solid var(--rule-strong); transform: translateY(1px); }
.jr-members li.st-tasted a { color: var(--text); }
.jr-members li.st-tasted .jr-mk { background: var(--accent); border-color: var(--accent); }
.jr-members li.st-cellar .jr-mk, .jr-members li.st-wishlist .jr-mk { border-color: var(--accent); }
.jr-classic .jr-hint { margin: -4px 0 10px; }

/* phones */
@media (max-width: 720px) {
  .jr-savebar { margin-left: calc(-1 * var(--gut-l)) !important; margin-right: calc(-1 * var(--gut-r)) !important; padding-left: var(--gut-l); padding-right: var(--gut-r); bottom: -48px; margin-bottom: -48px !important; padding-bottom: 14px; }
  .jr-satrow { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .jr-members { column-gap: 14px; }
  .jr-members a { font-size: 14px; }
  .jr-hbars li { grid-template-columns: minmax(0, 8em) minmax(0, 1fr) 3.6em; }
}
@media (max-width: 380px) {
  .jr-members { columns: 1; }
  .jr-2col { grid-template-columns: minmax(0, 1fr); }
  .jr-ph-prev { width: 70px; height: 94px; }
}

/* modules/30_somm.css */
/* Vitis Mundi v2, sommelier tools (30_somm*.js): filters, compare, climate twins, study, tasting trainer.
   Series colours for Compare were checked with the dataviz palette validator (all pairs, both themes). */
:root {
  --sm-s1: #8e1f3b;   /* garnet */
  --sm-s2: #b07a12;   /* old gold */
  --sm-s3: #2a6cb8;   /* river blue */
  --sm-ok: #3f7a4a;
  --sm-no: #a3303a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --sm-s1: #d65a73; --sm-s2: #bb8a22; --sm-s3: #4a8be0; --sm-ok: #79b884; --sm-no: #e0707a; }
}
:root[data-theme="dark"] { --sm-s1: #d65a73; --sm-s2: #bb8a22; --sm-s3: #4a8be0; --sm-ok: #79b884; --sm-no: #e0707a; }

/* quiz taps: no hover tooltip or pointer hints while the map is a question */
#app[data-sm-quiz] #tip { display: none !important; }
#app[data-sm-quiz] .maplibregl-canvas { cursor: crosshair !important; }

/* ring markers (sites, region points, taps, answers) */
.sm-ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--highlight); background: color-mix(in srgb, var(--highlight) 18%, transparent); box-shadow: 0 0 0 2px var(--panel); pointer-events: none; }
.sm-ring.s1 { border-color: var(--sm-s1); background: color-mix(in srgb, var(--sm-s1) 20%, transparent); }
.sm-ring.s2 { border-color: var(--sm-s2); background: color-mix(in srgb, var(--sm-s2) 20%, transparent); }
.sm-ring.s3 { border-color: var(--sm-s3); background: color-mix(in srgb, var(--sm-s3) 20%, transparent); }
.sm-ring.tap { width: 14px; height: 14px; border-color: var(--text); background: var(--text); box-shadow: 0 0 0 2px var(--panel); }
.sm-ring.tap.ok { border-color: var(--sm-ok); background: var(--sm-ok); }
.sm-ring.tap.no { border-color: var(--sm-no); background: var(--sm-no); }
.sm-ring.ans { width: 30px; height: 30px; border-width: 2.5px; }
.sm-ring.twin { width: 16px; height: 16px; }

/* ---------- filter ---------- */
#sheet-body[data-view="filter"] .sm-bar {
  position: sticky; top: -18px; z-index: 2; margin: 14px -24px 0; padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap;
  background: var(--panel); border-bottom: 1px solid var(--rule-strong); border-top: 1px solid var(--rule);
}
.sm-count { display: flex; flex-direction: column; gap: 0; min-width: 0; font-size: 15px; line-height: 1.25; }
.sm-count b { font-weight: 500; font-size: 22px; color: var(--accent); }
.sm-count small { font-family: var(--f-sc); font-size: 13px; letter-spacing: .03em; color: var(--muted); }
.sm-bar-b { display: flex; gap: 6px; }
.sm-ftabs { margin-top: 10px !important; }
.sm-ftabs .sm-rc { font-size: 11.5px; color: var(--muted); }
.sm-grp { border-bottom: 1px solid var(--rule-strong); }
.sm-grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 0 10px; min-height: 44px; font-family: var(--f-sc); font-size: 16px; letter-spacing: .06em; }
.sm-grp > summary::-webkit-details-marker { display: none; }
.sm-grp > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
.sm-grp[open] > summary::before { transform: rotate(90deg); }
.sm-grp > :not(summary) { margin: 0 0 16px; }
.sm-grp .vm-field + .vm-field, .sm-grp .vm-field + .sm-rng, .sm-grp .sm-rng + .vm-field { margin-top: 14px; }
.sm-pick .sm-chosen:empty { display: none; }
.sm-pick .sm-chosen { margin-bottom: 6px; }
.sm-pick .sm-opts { margin-top: 8px; }
.chip.sm-on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.chip.sm-add .sm-n, .chip .sm-n { font-size: 11.5px; color: var(--muted); margin-left: 2px; }
.sm-more { list-style: none; align-self: center; font-size: 13px; }
.chip.sm-tg[aria-pressed="true"], .chip[data-sort][aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.chip.sm-tg[aria-pressed="true"] .sw { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.sm-gm { margin-top: 8px; }

/* range with distribution behind it */
.sm-rng { margin-top: 14px; }
.sm-rng-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sm-rng-h output { font-size: 13.5px; color: var(--muted); }
.sm-rng.on .sm-rng-h output { color: var(--text); }
.sm-rng-t { position: relative; height: 40px; margin-top: 2px; }
.sm-hist { position: absolute; left: 10px; right: 10px; top: 2px; width: calc(100% - 20px); height: 22px; }
.sm-hist rect { fill: var(--rule-strong); }
.sm-hist rect.in { fill: color-mix(in srgb, var(--accent) 55%, transparent); }
.sm-rng-t input[type="range"] {
  position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22px; margin: 0;
  background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
}
.sm-rng-t input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: transparent; }
.sm-rng-t input.lo::-webkit-slider-runnable-track { background: var(--rule-strong); }
.sm-rng-t input[type="range"]::-moz-range-track { height: 2px; background: var(--rule-strong); }
.sm-rng-t input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; width: 22px; height: 22px; margin-top: -10px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--muted); cursor: grab;
}
.sm-rng-t input[type="range"]::-moz-range-thumb { pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted); cursor: grab; }
.sm-rng.on .sm-rng-t input[type="range"]::-webkit-slider-thumb { border-color: var(--accent); }
.sm-rng.on .sm-rng-t input[type="range"]::-moz-range-thumb { border-color: var(--accent); }
.sm-rng-t input[type="range"]:focus-visible { outline: none; }
.sm-rng-t input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--highlight); outline-offset: 2px; }
.sm-rng-t input.lo { z-index: 2; } .sm-rng-t input.hi { z-index: 3; }
.sm-rng-a { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); padding: 0 2px; }
.sm-rng.off { opacity: .55; }

/* aspect compass */
.sm-asp-row { display: grid; grid-template-columns: 148px 1fr; gap: 14px; align-items: center; margin-top: 6px; }
.sm-compass { width: 148px; height: 148px; touch-action: manipulation; }
.sm-w path { fill: var(--panel-2); stroke: var(--panel); stroke-width: 1.5; cursor: pointer; transition: fill .12s; }
.sm-w text { font-family: var(--f-sc); font-size: 8.5px; fill: var(--muted); pointer-events: none; letter-spacing: .04em; }
.sm-w:hover path { fill: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); }
.sm-w[aria-checked="true"] path { fill: var(--accent); }
.sm-w[aria-checked="true"] text { fill: var(--accent-ink); }
.sm-w:focus-visible { outline: none; }
.sm-w:focus-visible path { stroke: var(--highlight); stroke-width: 2.5; }
.sm-hub { fill: var(--panel); stroke: var(--rule-strong); }
.sm-asp.off .sm-w path { cursor: not-allowed; }
.sm-asp-side .tog { border-top: 1px solid var(--rule); }
.sm-asp-side .note { margin: 8px 0 0; font-size: 13.5px; }
.sm-src, .sm-ign { border-left: 2px solid var(--highlight); padding: 2px 0 2px 12px; margin-top: 14px !important; }
.sm-act { margin-top: 18px; }

/* results */
.sm-sort { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 10px; }
.sm-sort .chip { min-height: 32px; font-size: 14px; }
.sm-split { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.sm-sub { margin: 4px 0 6px; font-family: var(--f-sc); font-weight: 400; font-size: 15px; letter-spacing: .05em; color: var(--muted); }
.sm-split .row-meta { display: none; }

/* lessons */
.sm-lessons { list-style: none; margin: 10px 0 0; padding: 0; }
.sm-lessons li { border-top: 1px solid var(--rule); }
.sm-lessons li:last-child { border-bottom: 1px solid var(--rule); }
.sm-lesson { display: grid; gap: 2px; width: 100%; text-align: left; padding: 11px 2px 12px; min-height: 48px; }
.sm-lesson b { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 19px; line-height: 1.2; }
.sm-lesson span { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.sm-lesson:hover b { color: var(--accent); }
.sm-lessons li.on { border-left: 2px solid var(--accent); padding-left: 12px; }
.sm-lesson-t { padding: 0 0 14px; }
.sm-lesson-t p { font-size: 15.5px; }

/* saved */
.sm-save { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; margin-top: 14px; }
.sm-sv { display: flex; align-items: center; gap: 4px; }
.sm-sv .row { flex: 1; min-width: 0; }

/* ---------- compare ---------- */

.sm-pk { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 10px; border: 1px solid var(--rule-strong); border-radius: 2px; border-left-width: 3px; }

.sm-sc-v { position: relative; height: 22px; margin: 20px 6px 0; }

/* terrain */
.sm-el { display: grid; grid-template-columns: 52px 1fr; height: 170px; margin-top: 12px; }
.sm-el-ax { display: flex; flex-direction: column; justify-content: space-between; font-size: 10.5px; color: var(--faint); text-align: right; padding-right: 6px; }
.sm-el-plot { position: relative; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); border-left: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); }
.sm-cmp .sm-el-plot { grid-template-columns: repeat(var(--n), 1fr); }

.sm-rose .sh.s3 { fill: color-mix(in srgb, var(--sm-s3) 22%, transparent); stroke: var(--sm-s3); }

/* the place table */

.sm-tr { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px 12px; padding: 7px 0 9px; border-bottom: 1px solid var(--rule); align-items: baseline; }

.sm-g-h { display: flex; align-items: center; gap: 6px; margin: 14px 0 6px !important; }

/* vintage chart */

.sm-vt .grid { stroke: var(--rule); stroke-width: 1; }

/* ---------- study ---------- */
.st-quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px !important; }

.st-deck .vm-badge { align-self: center; }
.st-modes { display: grid; gap: 8px; margin-top: 16px !important; }
.st-mode { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; padding: 11px 14px 12px; border: 1px solid var(--rule-strong); border-left: 3px solid var(--accent); border-radius: 2px; }
.st-mode b { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 20px; line-height: 1.15; }
.st-mode span { grid-column: 1; font-size: 14px; color: var(--muted); line-height: 1.4; }
.st-mode small { grid-column: 2; grid-row: 1; align-self: baseline; font-size: 12px; color: var(--muted); }
.st-mode:hover { background: var(--panel-2); }

.st-all { margin-top: 18px !important; }

/* a session */
.st-top { display: flex; align-items: center; gap: 10px; }
.st-pos { font-size: 13px; color: var(--text); }
.st-tact { display: contents; }
.st-ml { flex: 1; min-width: 0; font-family: var(--f-sc); font-size: 14px; letter-spacing: .04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-bar { height: 2px; background: var(--rule); margin-top: 8px !important; }
.st-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s var(--ease); }
.st-card { margin-top: 14px !important; padding: 16px 16px 18px; }
.st-q { font-family: var(--f-display); font-size: 23px; line-height: 1.22; margin: 0; text-wrap: balance; }
.st-find .st-q, .st-name .st-q { margin-top: 14px; }
.st-more { margin: 6px 0 0 !important; }
.st-hintb { margin-top: 10px; font-size: 14.5px; }
.st-hint { margin: 8px 0 0; padding: 4px 0 4px 12px; border-left: 2px solid var(--highlight); font-size: 15px; font-style: italic; }
.st-ans { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule-strong); }
.st-a { margin: 0; font-size: 16px; line-height: 1.55; }
.st-links { margin: 10px 0 0; font-size: 14.5px; }
.st-act { margin-top: 16px !important; }
.st-howw { margin: 0 0 6px !important; width: 100%; }
.st-grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
.st-grades .btn { flex-direction: column; gap: 1px; justify-content: center; padding: 6px 4px 7px; min-height: 52px; }

.st-sum { list-style: none; margin: 14px 0 0; padding: 0; }

.tg { display: grid; gap: 2px; margin-top: 12px !important; }
.tg-r { display: grid; grid-template-columns: 104px 1fr; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.tg-seg { display: flex; border: 1px solid var(--rule-strong); border-radius: 2px; overflow: hidden; }

.tg-sw.f-white { background: #e7d98d; } .tg-sw.f-orange { background: #d98b3a; } .tg-sw.f-rose { background: #ec9a8c; } .tg-sw.f-red { background: #8e1f3b; }
.tg-sw.h-lemon-green { background: #dfe39a; } .tg-sw.h-lemon { background: #efe08a; } .tg-sw.h-gold { background: #e2b34a; } .tg-sw.h-amber { background: #c9832a; } .tg-sw.h-brown { background: #7b4a24; }
.tg-sw.h-orange { background: #e08a3e; } .tg-sw.h-pink { background: #f0a2b2; } .tg-sw.h-salmon { background: #ee9a7e; }

.tg-chosen:empty { display: none; }

.tg-sug { margin-top: 8px; }
.tg-fam { margin-top: 10px; }
.tg-fam summary { cursor: pointer; font-family: var(--f-sc); letter-spacing: .04em; color: var(--accent); min-height: 40px; display: flex; align-items: center; }
.tg-cl { margin: 12px 0 6px !important; }
.tg-list { list-style: none; margin: 8px 0 0; padding: 0; }
.tg-list li { padding: 8px 0 9px; border-bottom: 1px solid var(--rule); }
.tg-list li.top .tg-cn a { font-size: 22px; }
.tg-c { display: flex; align-items: baseline; gap: 10px; }
.tg-cn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tg-cn a { font-family: var(--f-display); font-style: italic; font-size: 18.5px; color: var(--text); text-decoration: none; line-height: 1.15; }
.tg-cn a:hover { color: var(--accent); }
.tg-cn small { font-family: var(--f-sc); font-size: 12.5px; letter-spacing: .03em; color: var(--muted); }

.tg-bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; }
.tg-list li:not(.top) .tg-bar i { background: color-mix(in srgb, var(--accent) 50%, var(--rule-strong)); }
.tg-mini { margin: 5px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.tg-miss { font-style: italic; }
.tg-why { margin-top: 16px !important; }
.tg-why > p:not(.lk):not(.note) { margin: 6px 0 0; font-size: 16px; line-height: 1.5; }
.tg-why .marg { margin-top: 12px; }
.tg-regs { list-style: none; margin: 8px 0 0; padding: 0; }
.tg-regs li { padding: 7px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.tg-regs li:first-child { border-top: 1px solid var(--rule); }
.tg-regs a { font-family: var(--f-display); font-style: italic; font-size: 17.5px; text-decoration: none; }

.tg-vin { margin-top: 14px; }

    </div>
    <div class="sheet-body" id="sheet-body" tabindex="-1"></div>
  </aside>

  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>

  const lons = pts.map(a => a.lp[0]).sort((a, b) => a - b), lats = pts.map(a => a.lp[1]).sort((a, b) => a - b);
  const q = (arr2, t) => arr2[Math.min(arr2.length - 1, Math.max(0, Math.round(t * (arr2.length - 1))))];
  const lo = pts.length > 12 ? 0.07 : 0, hi = pts.length > 12 ? 0.93 : 1;
  const bb = [q(lons, lo) - 0.5, q(lats, lo) - 0.5, q(lons, hi) + 0.5, q(lats, hi) + 0.5];
  if (isPhone()) setSnap('peek');
  flyBbox(bb, { maxZoom: 7 });
}

const TOUR = { on: false, t: 0, i: 0 };
function eraGroups() {

}
function eraSpan(evs) { const a = evs[0].year, b = evs[evs.length - 1].year; return a == null ? '' : a === b ? whenLabel(a) : `${whenLabel(a)} \u2013 ${whenLabel(b)}`; }
function buildStrip() {
  const st = $('#strip');

  st.innerHTML = `<div class="strip-side"><h2>Nine thousand years of wine</h2><p>${D.timeline.length} moments, ${groups.length} eras. Tap one to travel there.</p>
    <div class="tl-controls"><button type="button" class="btn solid" id="tl-play" aria-pressed="false">Play the tour</button>
    <button type="button" class="icon-btn" id="tl-x" aria-label="Close timeline"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
    <div class="ribbon" id="ribbon" aria-hidden="true"></div>
    <div class="strip-scroll" id="strip-scroll">${groups.map(gr => `<section class="s-era" aria-label="${esc(gr.name)}"><div class="s-era-h">${esc(gr.name)}<span class="mono">${esc(eraSpan(gr.evs))}</span></div><div class="s-evs">${gr.evs.map(e => `<button type="button" class="s-ev" data-ev="${esc(e.id)}"><span class="yr">${esc(e.when)}</span><span class="ttl">${esc(e.title)}</span><span class="plc">${esc(e.place)}</span><i class="prog"></i></button>`).join('')}</div></section>`).join('')}</div>`;
  // the ribbon: every event as a tick on a compressed log-like time axis
  const rb = $('#ribbon');
  const tmap = y => { const now = 2026; const age = Math.max(1, now - (y ?? now)); return 1 - Math.log(age) / Math.log(9500); };
  rb.innerHTML = D.timeline.map(e => `<i class="tick" data-tk="${esc(e.id)}" title="${esc(e.when)}: ${esc(e.title)}" style="left:${(tmap(e.year) * 100).toFixed(2)}%"></i>`).join('') +
    (() => { let last = -1; return [-6000, -3000, -1000, 0, 1000, 1500, 1800, 1900, 1976, 2026].map(y => { const x = tmap(y === 0 ? 1 : y); if (x - last < 0.075) return ''; last = x; return `<span class="lab" style="left:${(x * 100).toFixed(2)}%">${y < 0 ? fmt(-y) + ' BC' : y === 0 ? 'AD 1' : y}</span>`; }).join(''); })();

}

/* ---------- profile sections ---------- */
const SLOT_ORDER = ['hero', 'top', 'mid', 'end'];
const slotHTML = name => `<div class="vm-slot" data-slot="${name}"></div>`;
let _secRun = 0;
async function runSections(type, id, extra = {}) {
  const body = $('#sheet-body');
  const run = ++_secRun;
  const ent = { ...(entityOf(id) || { type, id }), type };
  for (const [k, v] of Object.entries(extra)) if (v != null) ent[k] = v;
  VMX.cur = ent;
  const list = VMX.sections.filter(s => s.types.has(type) || s.types.has('*')).sort((a, b) => a.order - b.order);
  for (const s of list) {
    let slot = body.querySelector(`.vm-slot[data-slot="${s.slot}"]`) || body.querySelector('.vm-slot[data-slot="end"]');
    if (!slot) { slot = document.createElement('div'); slot.className = 'vm-slot'; slot.dataset.slot = 'end'; body.appendChild(slot); }
    const el = document.createElement('section');
    el.className = 'vm-sec';
    el.dataset.sec = s.id;
    slot.appendChild(el);
    Promise.resolve().then(() => s.fn(el, ent)).then(r => {
      if (run !== _secRun) return;
      if (r === false || (!el.childElementCount && !el.textContent.trim())) el.hidden = true;
    }).catch(e => { console.warn('[VM section]', s.id, e); el.hidden = true; });
  }
  vmEmit('profile:open', { type, id, entity: ent, el: body });
}

/* ---------- custom views ---------- */
function viewFor(h) {
  if (VMX.views.has(h)) return { def: VMX.views.get(h), arg: '' };
  for (const [k, def] of VMX.views) if (def.prefix && h.startsWith(k + '-')) return { def, arg: h.slice(k.length + 1) };
  return null;
}
async function showCustomView(cv, hash, opts) {
  const { def, arg } = cv;
  setView(def.id);
  openSheet(isPhone() ? (def.snap || 'full') : null, true);
  renderSheet('', def.crumb || def.title || '');
  const body = $('#sheet-body');
  body.dataset.view = def.id;
  VMX.cur = { type: 'view', id: def.id, arg };
  try { await def.render(body, { hash, arg, opts }); } catch (e) { console.warn('[VM view]', def.id, e); }
  bindProfile();
  vmEmit('view', { id: def.id, arg });
}

/* ---------- nav entries ---------- */
function addNav(item) {
  const it = { order: 100, ...item };
  if (!it.id || !/^[a-z][a-z0-9-]{2,}$/.test(it.id)) { console.warn('[VM] nav id must be 3+ chars, lower-case: ' + it.id); return () => {}; }
  VMX.navItems = VMX.navItems.filter(x => x.id !== it.id).concat(it).sort((a, b) => a.order - b.order);
  renderNav();
  return () => { VMX.navItems = VMX.navItems.filter(x => x !== it); renderNav(); };
}
function renderNav() {
  const nav = $('.views');
  if (!nav) return;
  for (const b of $$('button[data-vm]', nav)) b.remove();
  for (const it of VMX.navItems) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.vm = it.id;
    b.dataset.view = it.id;
    b.setAttribute('aria-pressed', String(APP.view === it.id));
    b.innerHTML = (it.icon ? `<span class="nav-ic" aria-hidden="true">${it.icon}</span>` : '') + `<span>${esc(it.label)}</span>`;
    if (it.title) b.title = it.title;
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (it.onClick) { it.onClick(e); return; }
      if (APP.view === it.id && !$('#sheet').hidden) { closeSheet(); return; }
      APP._opts = {}; APP.nav(it.id);
    });
    nav.appendChild(b);
  }
  layoutNav();
}
/* the nav row scrolls sideways when it overflows; a soft fade marks the hidden side */
function layoutNav() {
  const nav = $('.views');
  if (!nav) return;
  const upd = () => { nav.dataset.ovl = nav.scrollLeft > 2 ? '1' : '0'; nav.dataset.ovr = nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2 ? '1' : '0'; };
  if (!nav._vmb) { nav._vmb = 1; nav.addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); }
  requestAnimationFrame(upd);
}

/* ---------- highlight ---------- */
function siteRings(ids) {
  if (!map) return;
  const fc = { type: 'FeatureCollection', features: ids.map(id => D.siteById.get(id)).filter(s => s && s.lon != null).map(s => ({ type: 'Feature', properties: { id: s.id }, geometry: { type: 'Point', coordinates: [s.lon, s.lat] } })) };
  if (!map.getSource('vmhl-sites')) {
    if (!fc.features.length) return;
    map.addSource('vmhl-sites', { type: 'geojson', data: fc });
    map.addLayer({ id: 'vmhl-sites', type: 'circle', source: 'vmhl-sites', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 5, 12, 11], 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': TOK.highlight, 'circle-stroke-width': 2.2 } }, 'anchor-top');
  } else map.getSource('vmhl-sites').setData(fc);
}
function vmHighlight(ids, opts = {}) {
  ids = arr(ids).filter(Boolean);
  if (!map) return;
  const sites = ids.filter(id => typeOfId(id) === 'site');
  siteRings(sites);
  ids = ids.filter(id => typeOfId(id) !== 'site');
  VMX.hlOwner = opts.owner || 'module';
  S.dim = opts.dimOthers !== false;
  setGrapeHighlight(ids.length ? ids : null);
  if (map.getLayer('vmhl-sites')) map.setPaintProperty('vmhl-sites', 'circle-stroke-color', TOK.highlight);
  // make sure the polygons of every country involved are drawn
  const isos = [...new Set(ids.map(isoOfId).filter(Boolean))];
  if (opts.load !== false && isos.length <= 6) for (const iso of isos) ensureCountryGeo(iso);
  const pill = $('#pill');
  if (opts.label && ids.length + sites.length) {
    pill.innerHTML = `<span>${opts.labelHTML || `<b>${esc(opts.label)}</b>`} \u00b7 <span class="mono">${ids.length + sites.length}</span></span><button type="button" id="pill-x" aria-label="Clear the highlight">Clear</button>`;
    pill.hidden = false;
    $('#pill-x').onclick = () => { vmClearHighlight(); if (opts.onClear) opts.onClear(); };
  }
  if (opts.fit) frameIds(ids.concat(sites), opts.fit === true ? {} : opts.fit);
}
function vmClearHighlight() {
  VMX.hlOwner = null;
  S.dim = true;
  setGrapeHighlight(null);
  siteRings([]);
  $('#pill').hidden = true;
}
function frameIds(ids, o = {}) {
  const pts = arr(ids).map(id => entityOf(id)).filter(e => e && (e.bbox || e.lp));
  if (!pts.length) return;
  if (pts.length === 1) { vmFlyTo(pts[0].id, o); return; }
  const lons = pts.map(e => e.lp ? e.lp[0] : (e.bbox[0] + e.bbox[2]) / 2).sort((a, b) => a - b);
  const lats = pts.map(e => e.lp ? e.lp[1] : (e.bbox[1] + e.bbox[3]) / 2).sort((a, b) => a - b);
  const q = (a, t) => a[Math.min(a.length - 1, Math.max(0, Math.round(t * (a.length - 1))))];
  const lo = pts.length > 12 ? 0.07 : 0, hi = pts.length > 12 ? 0.93 : 1;
  if (isPhone() && !$('#sheet').hidden) setSnap('peek');
  flyBbox([q(lons, lo) - 0.3, q(lats, lo) - 0.3, q(lons, hi) + 0.3, q(lats, hi) + 0.3], { maxZoom: o.maxZoom ?? 9 });
}
function vmFlyTo(target, o = {}) {
  if (!map || target == null) return;
  if (typeof target === 'object') {
    if (Array.isArray(target.bbox)) return flyBbox(target.bbox, o);
    const lon = target.lon ?? target.lng ?? target.center?.[0], lat = target.lat ?? target.center?.[1];
    return flyPoint(lon, lat, target.zoom, o);
  }
  const id = String(target);
  const t = typeOfId(id);
  if (t === 'country') { const bb = mainBbox(id) || D.countries[id]?.bbox; if (bb) flyBbox(bb, { maxZoom: 5.6, ...o }); return; }
  const e = entityOf(id);
  if (!e) return;
  if (e.bbox && e.bbox[2] - e.bbox[0] > 1e-4) return flyBbox(e.bbox, { maxZoom: e.area < 2 ? 14 : e.area < 30 ? 12.5 : 11, ...o });
  if (e.lp) return flyPoint(e.lp[0], e.lp[1], o.zoom ?? (t === 'site' ? 12.2 : t === 'grape' ? 5 : 8.4), o);
}

/* ---------- search picking ---------- */
const SEARCH_TYPES = { appellation: 'app', app: 'app', country: 'country', region: 'region', site: 'site', grape: 'grape', term: 'term' };
function vmQuery(q, opts = {}) {
  const types = opts.types ? new Set(arr(opts.types).map(t => SEARCH_TYPES[t] || t)) : null;
  const res = search(q, types ? 200 : (opts.limit || 24));
  return res.filter(r => !types || types.has(r.t)).slice(0, opts.limit || 24).map(r => ({ id: r.id, name: r.name, type: TYPE_ALIAS[r.t] || r.t, meta: r.meta || '' }));
}
function vmPick(opts = {}) {
  return new Promise(resolve => {
    const q = $('#q');
    SR.pick = { types: opts.types ? new Set(arr(opts.types).map(t => SEARCH_TYPES[t] || t)) : null, onPick: opts.onPick, resolve, label: opts.label || opts.placeholder || 'Pick a place' };
    $('.search').dataset.pick = '1';
    const bar = $('#pickbar');
    bar.querySelector('span').textContent = SR.pick.label;
    bar.hidden = false;
    q.placeholder = opts.placeholder || 'Search for a place to pick';
    q.value = '';
    APP.loadIndex(); APP.loadGlobals(); wave2();
    if (isPhone() && !$('#sheet').hidden) setSnap('peek');
    q.focus();
  });
}
function endPick(result) {
  const p = SR.pick;
  if (!p) return;
  SR.pick = null;
  delete $('.search').dataset.pick;
  $('#pickbar').hidden = true;
  $('#q').placeholder = 'Search appellations, grapes, places';
  if (result && p.onPick) { try { p.onPick(result); } catch (e) { console.warn('[VM pick]', e); } }
  p.resolve(result || null);
}

/* ---------- sidecar data (site/data/{topo,vintage,photos,regs,study}) ---------- */
const SIDE = {
  json(p) { return has(p) ? getJSON(p) : Promise.resolve(null); },
  /* parent chain used for fallbacks: fine unit -> parent appellations -> content region */
  async chain(id) {
    const out = [id];
    const t = typeOfId(id);
    if (t === 'site') {
      // sites arrive with the second data wave: wait briefly for them, else use the content file's record
      if (!D.siteById.has(id)) await Promise.race([VM.data.loadSites(), sleep(4000)]);
      let s = D.siteById.get(id);
      const c = await getContent(isoOfId(id));
      const cs = arr(c?.sites).find(x => x.id === id);
      const app = s?.app || cs?.app || cs?.app_main || null;
      if (app) out.push(...(await SIDE.chain(app)));
      if (cs?.app_main && cs.app_main !== app) out.push(...(await SIDE.chain(cs.app_main)));
      if (cs?.region_hint) out.push(cs.region_hint);
      return [...new Set(out)];
    }
    if (t !== 'appellation') return out;
    await Promise.race([APP.loadIndex(), sleep(3000)]);
    for (const a of ancestry(id).reverse()) out.push(a.id);
    const iso = isoOfId(id);
    const c = await (D.byId.get(id)?.fine ? getFineContent(iso) : getContent(iso));
    const chainIds = out.slice();
    for (const x of chainIds) {
      const p = c?.profiles?.[x];
      if (p?.subregion_id) out.push(p.subregion_id);
      if (p?.region_id) out.push(p.region_id);
    }
    for (const r of arr(c?.regions)) if (arr(r.app_ids).some(x => chainIds.includes(x))) out.push(r.id);
    return [...new Set(out)];
  },
  async topo(id) {
    const t = typeOfId(id), iso = isoOfId(id);
    if (t === 'site') { const j = await SIDE.json('data/topo/_sites.json'); return j?.[id] || null; }
    if (!iso) return null;
    const j = await SIDE.json(`data/topo/${iso}.json`);
    return j?.[id] || null;
  },
  async attrs() {
    const j = await SIDE.json('data/topo/_attrs.json');
    if (!j) return null;
    const cols = j._cols || ['country', 'gst', 'gdd', 'hi', 'prec', 'gsp', 'dtr', 'mjt', 'elev', 'slope', 'aspect', 'area', 'fine'];
    return { cols, rows: j, get(id) { const r = j[id]; if (!r || id === '_cols') return null; const o = { id }; cols.forEach((c, i) => { o[c] = r[i]; }); return o; } };
  },
  /* first id in the parent chain that has data in {kind}/{iso}.json; returns {id, data, inherited} */
  async inherit(kind, id, pick) {
    const ids = await SIDE.chain(id);
    for (const x of ids) {
      const iso = isoOfId(x);
      if (!iso) continue;
      const j = await SIDE.json(`data/${kind}/${iso}.json`);
      const v = j?.[x];
      if (v && (!pick || pick(v))) return { id: x, data: v, inherited: x !== id };
    }
    return null;
  },
  vintage(id) { return SIDE.inherit('vintage', id, v => Array.isArray(v.gst) && v.gst.length); },
  /* vintage events for a place: its own, its ancestors' and its content regions', plus those of the region's
     flagship appellation (the member with the most researched events; the runner-up when the place is the flagship),
     because sources describe a whole zone (Barolo for Barbaresco, Porto for the Douro). Each event gets
     {from: id it was recorded on, rel: 'own' | 'parent' | 'region' | 'regional'}. */
  async events(id) {
    const all = await SIDE.json('data/vintage/_events.json');
    const list = Array.isArray(all) ? all : arr(all?.events);
    if (!list.length) return [];
    const by = new Map();
    for (const e of list) { if (!by.has(e.id)) by.set(e.id, []); by.get(e.id).push(e); }
    const chain = await SIDE.chain(id);
    const out = [], seen = new Set();
    const add = (x, rel) => {
      for (const e of by.get(x) || []) {
        const k = e.year + '|' + e.kind + '|' + String(e.text).slice(0, 60);
        if (seen.has(k)) continue;
        seen.add(k); out.push({ ...e, from: x, rel });
      }
    };
    for (const x of chain) add(x, x === id ? 'own' : /^region-/.test(x) ? 'region' : 'parent');
    const regions = chain.filter(x => /^region-/.test(x));
    if (typeOfId(id) === 'region' && !regions.includes(id)) regions.unshift(id);
    for (const r of regions) {
      const c = await getContent(isoOfId(r));
      const reg = arr(c?.regions).find(x => x.id === r);
      const members = [...new Set(arr(reg?.app_ids))].filter(m => by.has(m)).sort((a, b) => by.get(b).length - by.get(a).length);
      const flag = members.find(m => !chain.includes(m));
      if (flag) add(flag, 'regional');
    }
    return out.sort((a, b) => a.year - b.year);
  },
  async drift(id) {
    const j = await SIDE.json('data/vintage/_drift.json');
    if (!j) return null;
    const ids = await SIDE.chain(id);
    for (const x of ids) { const v = j[x] || j.items?.[x]; if (v) return { id: x, data: v, inherited: x !== id }; }
    return null;
  },
  async regs(id) {
    const r = await SIDE.inherit('regs', id);
    const iso = isoOfId(id);
    const j = iso ? await SIDE.json(`data/regs/${iso}.json`) : null;
    return r || j?._national ? { ...(r || {}), national: j?._national || null } : null;
  },
  async photos(id) {
    const t = typeOfId(id);
    if (t === 'grape' || t === 'event' || t === 'soil' || t === 'term') {
      const j = await SIDE.json('data/photos/_global.json');
      return arr(j?.[id] || j?.[id.replace(/^grape-/, '')]);
    }
    const iso = isoOfId(id);
    if (!iso) return [];
    const j = await SIDE.json(`data/photos/${iso}.json`);
    return arr(j?.[id]);
  },
  study(name) { return SIDE.json(`data/study/${name.replace(/\.json$/, '')}.json`); }
};

/* Vitis Mundi v2: base maps (standard, satellite, topographic), national aerial and topographic maps, 3D terrain,
   relief shading, contour lines, the sunlight explorer and river journeys. Everything here needs the network, so it
   is switched on only in the Pages build (VM.mode === 'gh'); the artifact build keeps v1 exactly. */
const GH = () => VM.mode === 'gh';
const BM = {
  base: 'standard',                 /* 'standard' | 'satellite' | 'topo' */
  terrain: false,                   /* 3D terrain on */
  exag: clamp(+store.get('exag', 1.4) || 1.4, 1, 3),
  shade: store.get('shade', true),  /* relief shading on the standard map */
  contours: store.get('contours', false),
  sun: null,                        /* sunlight explorer: {doy, t} or null */
  cover: null,                      /* coverage polygons in Web Mercator units */

/* ---------- river journeys ---------- */
const JR = { list: null, p: null, cur: null, km: 0, playing: false, speed: 1, raf: 0, last: 0, br: null, lit: [], capKey: '', prev: null };
function loadJourneys() {
  if (!JR.p) JR.p = (has('data/map/journeys.json') ? getJSON('data/map/journeys.json') : Promise.resolve(null)).then(j => { JR.list = arr(j?.journeys); return JR.list; });
  return JR.p;
}
const kmFmt = v => `${fmt(v, v < 10 ? 1 : 0)} km`;
function journeysHTML(list) {
  let out = `<div class="head"><p class="eyebrow">Fly-throughs</p><h2 class="title">River journeys</h2><p class="tagline">Wine follows water. Ride the great wine rivers in 3D and watch the appellations go by.</p></div>`;
  if (!list.length) return out + H.pending('set of journeys');
  out += `<ul class="list jr-list">${list.map(j => `<li><a class="row" href="#journey-${esc(j.id)}"><span class="row-name">${esc(j.title)}<small class="jr-t">${esc(j.text)}</small></span><span class="row-meta">${esc(kmFmt(j.km))}</span></a></li>`).join('')}</ul>`;
  out += `<p class="note">Routes follow Natural Earth river lines, smoothed for the camera, so the view floats over the valley rather than tracing every bend. Names come from the atlas polygons the route passes within about a kilometre of, and from the sites and towns on the banks.</p>`;
  return out;
}
function jrPoint(km) {
  const j = JR.cur, n = j.line.length, f = clamp(km / j.step, 0, n - 1), i = Math.floor(f), t = f - i;
  const a = j.line[i], b = j.line[Math.min(n - 1, i + 1)];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function bearingOf(a, b) {

}

  else { let d = ((tb - JR.br + 540) % 360) - 180; JR.br = (JR.br + d * 0.04 + 360) % 360; }

}
function jrActive(km) {
  const j = JR.cur;

  // closest first (each stop keeps its nearest distance to the route), named crus and profiled units ahead of ties
  const near = apps.filter(s => s.fine || s.area <= 600).sort((a, b) => ((a.d ?? 1) - (b.d ?? 1)) * 2 + (b.prof - a.prof) * 0.3 + (b.fine - a.fine) * 0.2).slice(0, 4);

function jrCaption(force) {

  const sc = $('#jr-scrub'); if (sc && document.activeElement !== sc) sc.value = JR.km.toFixed(2);

  const ctx = [a.umb?.name, a.site && a.town ? a.town.name : '', a.site ? (KIND[a.site.kind] || '') : ''].filter(Boolean);
  const chips = a.near.filter(x => x.name !== title).map(x => `<li><a class="chip" href="#${esc(x.id)}" data-jr-open><i class="sw" style="background:var(--w-${STYLES.includes(x.style) ? x.style : 'mixed'})"></i>${esc(x.name)}</a></li>`).join('');
  $('#jr-cap').innerHTML = `<p class="dk-ctx">${esc(ctx.join(' \u00b7 ') || j.title)}</p><h3 class="dk-title">${a.site ? `<a href="#${esc(a.site.id)}" data-jr-open>${esc(title)}</a>` : esc(title)}</h3>${chips ? `<ul class="chips dk-chips">${chips}</ul>` : ''}`;

/* Vitis Mundi v2: profile sections built from the sidecars (photos, terrain, vintages, climate drift, rules).
   Each section hides itself when its data file is missing, so the profile degrades to v1. */

/* ---------- photos (Wikimedia Commons; Pages build only, the artifact cannot load external images) ---------- */
function photoHTML(list, name) {
  const p = list[0];
  const ratio = clamp((+p.w || 4) / (+p.h || 3), 4 / 3, 2.2);
  const credit = ph => `${ph.caption ? `${inl(ph.caption)} ` : ''}<span class="ph-by">${esc(ph.author || 'Unknown author')}, ${ph.license_url ? `<a href="${esc(ph.license_url)}" target="_blank" rel="noopener noreferrer">${esc(ph.license || 'licence')}</a>` : esc(ph.license || '')}, <a href="${esc(ph.page)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a></span>`;
  let out = `<figure class="ph"><div class="ph-hero" style="aspect-ratio:${ratio.toFixed(3)}"><img src="${esc(p.thumb)}" width="${+p.w || 640}" height="${+p.h || 427}" alt="${esc(p.caption || name)}" loading="lazy" decoding="async" crossorigin="anonymous" referrerpolicy="no-referrer"></div><figcaption class="ph-cap">${credit(p)}</figcaption></figure>`;
  if (list.length > 1) out += `<ul class="ph-gal" aria-label="More photos">${list.map((x, i) => `<li><button type="button" class="ph-th${i ? '' : ' on'}" data-ph="${i}" aria-label="Show photo ${i + 1}: ${esc(x.caption || name)}"><img src="${esc(/^https:\/\/upload\.wikimedia\.org\//.test(x.thumb_small || '') ? x.thumb_small : x.thumb)}" alt="" loading="lazy" decoding="async" crossorigin="anonymous" referrerpolicy="no-referrer"></button></li>`).join('')}</ul>`;
  return out;
}
function bindPhotos(el, list, name) {
  el.querySelectorAll('[data-ph]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.ph, p = list[i];
    const img = el.querySelector('.ph-hero img');
    el.querySelector('.ph-hero').style.aspectRatio = clamp((+p.w || 4) / (+p.h || 3), 4 / 3, 2.2).toFixed(3);
    img.src = p.thumb; img.alt = p.caption || name;
    el.querySelector('.ph-cap').innerHTML = photoHTML([p], name).match(/<figcaption class="ph-cap">([\s\S]*?)<\/figcaption>/)[1];
    el.querySelectorAll('.ph-th').forEach(t => t.classList.toggle('on', t === b));
  }));
  // a photo that fails to load (renamed or deleted on Commons) removes itself
  el.querySelectorAll('img').forEach(img => img.addEventListener('error', () => { const li = img.closest('li'); if (li) li.remove(); else el.hidden = true; }, { once: true }));
}

/* ---------- terrain (Copernicus DEM GLO-30 sidecar) ---------- */
const OCT = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const OCT_LONG = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
const pctDeg = s => Math.atan(s / 100) * 180 / Math.PI;
function roseSVG(ar, a) {
  const S0 = 132, c = S0 / 2, R = 50;
  const mx0 = Math.max(0.01, ...ar);
  let petals = '';
  ar.forEach((v, i) => {
    const r = 6 + (R - 6) * Math.sqrt(v / mx0);
    const a0 = (i * 45 - 20) * Math.PI / 180, a1 = (i * 45 + 20) * Math.PI / 180;
    const p = (ang, rr) => `${(c + rr * Math.sin(ang)).toFixed(1)},${(c - rr * Math.cos(ang)).toFixed(1)}`;
    petals += `<path class="rose-p" d="M${c},${c} L${p(a0, r)} A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${p(a1, r)} Z"><title>${OCT_LONG[i]}-facing: ${Math.round(v * 100)}% of the sloping ground</title></path>`;
  });
  const ring = [R * 0.5, R].map(r => `<circle cx="${c}" cy="${c}" r="${r}" class="rose-g"/>`).join('');
  const labs = [['N', c, 9], ['E', S0 - 6, c + 4], ['S', c, S0 - 2], ['W', 6, c + 4]].map(([t, x, y]) => `<text x="${x}" y="${y}" class="rose-l">${t}</text>`).join('');
  const arrow = a == null ? '' : (() => { const ang = a * Math.PI / 180, x = c + (R + 4) * Math.sin(ang), y = c - (R + 4) * Math.cos(ang); return `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rose-a"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" class="rose-ad"/>`; })();
  return `<svg class="rose" viewBox="0 0 ${S0} ${S0}" width="${S0}" height="${S0}" role="img" aria-label="Aspect rose: ${ar.map((v, i) => `${OCT_LONG[i]} ${Math.round(v * 100)}%`).join(', ')}${a != null ? `. Mean aspect ${Math.round(a)} degrees` : '. No dominant aspect'}">${ring}<line x1="${c}" y1="${c - R}" x2="${c}" y2="${c + R}" class="rose-g"/><line x1="${c - R}" y1="${c}" x2="${c + R}" y2="${c}" class="rose-g"/>${petals}${arrow}${labs}</svg>`;
}
function slopeWord(s) { return s < 3 ? 'flat' : s < 8 ? 'gently rolling' : s < 15 ? 'moderately sloping' : s < 30 ? 'steep' : 'very steep'; }
function aspectMeaning(a, lat) {
  if (a == null) return '';
  const south = lat == null || lat >= 0;
  const o = Math.round(((a % 360) + 360) % 360 / 45) % 8;           // 0 N .. 4 S
  const sunward = south ? [4, 3, 5] : [0, 1, 7];                       // facing the midday sun
  const shady = south ? [0, 1, 7] : [4, 3, 5];
  const morning = [2, south ? 3 : 1].includes(o), evening = [6, south ? 5 : 7].includes(o);
  if (sunward.includes(o) && !morning && !evening) return `facing the midday sun, the warmest exposure, which buys ripeness where the season is short`;
  if (morning) return `turned to the morning sun, which dries the dew early and spares the grapes the hottest afternoon light`;
  if (evening) return `turned to the afternoon and evening sun, the warmest part of the day`;
  if (shady.includes(o)) return `turned away from the midday sun, so it ripens later and keeps freshness, an asset in hot places and a risk in cool ones`;

/* Vitis Mundi v2: installable app on the Pages build (service worker, install prompt, offline note) */
const PWA = { prompt: null };
function initPWA() {
  if (VM.mode !== 'gh' || !('serviceWorker' in navigator)) return;
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (location.protocol !== 'https:' && !local) return;
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { /* blocked or unsupported: the site works without it */ }); });
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; vmEmit('pwa:installable', true); });
  addEventListener('appinstalled', () => { PWA.prompt = null; APP.toast('Vitis Mundi is on your home screen.'); });
  addEventListener('offline', () => APP.toast('Offline: places you have opened before still work.'));
}
function installHTML() {
  if (VM.mode !== 'gh') return '';
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return `<p class="note">Running as an installed app. Places, data and map tiles you open are kept for offline use.</p>`;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="pwa-box">${PWA.prompt ? `<button type="button" class="btn solid" id="pwa-install">Install the atlas</button>` : ''}
    <p class="note">${ios ? 'On an iPhone or iPad: tap Share, then Add to Home Screen.' : PWA.prompt ? 'Adds Vitis Mundi to your home screen and app list.' : 'Your browser can add this page to the home screen from its menu (Install app, or Add to Home Screen).'} Once installed it opens without the browser bar, and the places, data and map tiles you have viewed stay available offline.</p></div>`;
}
function bindInstall(root) {
  const b = root.querySelector('#pwa-install');
  if (b) b.addEventListener('click', async () => { const p = PWA.prompt; if (!p) return; p.prompt(); try { await p.userChoice; } catch (e) { /* dismissed */ } PWA.prompt = null; b.remove(); });
}
initPWA();

      const hits = mapHits(m, e.clientX - rc.left, e.clientY - rc.top, !matchMedia('(hover: hover) and (pointer: fine)').matches);
      if (!hits.length) return;

  /* ---------- rendering the views ---------- */

      <p class="prose jr-off">The journal of bottles, tasting notes, label photos and places lives on the full Vitis Mundi site, where it can save what you write and follow you between devices. This copy of the atlas is a sealed preview with no storage.</p>
      <div class="btn-row"><a class="btn solid" href="${esc(SITE_URL)}#journal" target="_blank" rel="noopener noreferrer">Open the full site</a></div>`;
  }
  async function renderJournal(el, ctx) {
    CUR.el = el; CUR.arg = (ctx && ctx.arg) || ''; CUR.kind = null;
    if (!GH) { CUR.kind = 'off'; el.innerHTML = offHTML(); return; }
    await Promise.race([ready, VM.util.sleep(2500)]);
    if (CUR.el !== el) return;
    const arg = CUR.arg;
    let m;
    if ((m = arg.match(/^bottle-([0-9a-f-]{36})$/))) return showCard(el, m[1]);
    if ((m = arg.match(/^edit-([0-9a-f-]{36})$/))) return showForm(el, m[1], null);
    if (arg === 'new' || /^new-/.test(arg)) {
      const rest = arg.slice(4);
      if (STATUS.includes(rest)) V.newStatus = rest;
      return showForm(el, null, rest.startsWith('from-') ? rest.slice(5) : null);
    }
    if (arg.startsWith('from-')) return showFrom(el, arg.slice(5));

  function showMain(el, tab) {

  /* the sheet body is shared by every view and profile: one delegated listener, active only while it shows the journal */

    if (ae && el.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    const st = el.scrollTop;

  function bindMain(el) {

      const ovr = () => { row.dataset.ovl = row.scrollLeft > 2 ? '1' : '0'; row.dataset.ovr = row.scrollLeft + row.clientWidth < row.scrollWidth - 2 ? '1' : '0'; };

    }

  /* ---------- export and import ---------- */
  function exportData() {
    return { app: 'Vitis Mundi cellar journal', version: 1, exported_at: nowIso(), mode: J.mode, bottles: J.bottles.map(copyB), notes: J.notes.map(n => ({ ...n })), lists: J.lists.map(l => ({ ...l })) };
  }
  function download(name, type, text) {
    try {
      const blob = new Blob([text], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast(`Saved ${name}`);
    } catch (e) { toast('This browser blocked the download.'); }
  }
  function toCSV() {
    const cols = ['id', 'status', 'producer', 'wine', 'vintage', 'appellation', 'appellation_id', 'site_id', 'region_id', 'country', 'style', 'grapes', 'classification', 'tasted_on', 'where_tasted', 'with_whom', 'occasion', 'price', 'currency', 'bottle_ml', 'quantity', 'drink_from', 'drink_to', 'rating', 'would_buy_again', 'notes', 'sat_json', 'photo_path', 'created_at', 'updated_at'];
    const cell = v => {
      if (v == null) return '';
      let s = typeof v === 'string' ? v : String(v);
      if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;   /* keep spreadsheets from running formulas */
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = J.bottles.map(b => cols.map(c => cell(c === 'appellation' ? bApp(b) : c === 'grapes' ? b.grapes.map(grapeName).join('; ') : c === 'sat_json' ? (satCount(b.sat) ? JSON.stringify(b.sat) : '') : c === 'would_buy_again' ? (b.would_buy_again == null ? '' : b.would_buy_again ? 'yes' : 'no') : b[c])).join(','));

      const inJ = new Set(J.bottles.map(b => b.country).filter(Boolean));
      const wine = new Set(Object.keys(VM.data.countries || {}));
      w.innerHTML = `<svg viewBox="0 0 360 142" role="img" aria-label="World map: ${esc(ts.countries.size ? 'tasted in ' + [...ts.countries].map(c => VM.data.countryName(c)).join(', ') : 'no countries tasted yet')}">${paths.map(p => `<path d="${p.d}" class="${ts.countries.has(p.iso) ? 'on' : inJ.has(p.iso) ? 'some' : wine.has(p.iso) ? 'wine' : ''}">${ts.countries.has(p.iso) || inJ.has(p.iso) ? `<title>${esc(VM.data.countryName(p.iso))}</title>` : ''}</path>`).join('')}</svg>
        <p class="jr-legend"><span><i class="on"></i>Tasted</span><span><i class="some"></i>In the cellar or wishlist</span><span><i class="wine"></i>Wine country in the atlas</span></p>`;
    }).catch(() => { const w = box.querySelector('[data-world]'); if (w) w.remove(); });
    passportData().then(lists => {
      const c = box.querySelector('[data-classics]');
      if (!c) return;
      c.innerHTML = lists.map(L => `<details class="jr-classic"><summary><span class="jr-cl-t">${esc(L.title)}<small>${esc(L.sub)}</small></span><span class="jr-cl-n vm-num">${L.tasted}<span>/${L.members.length}</span></span><span class="jr-prog" aria-hidden="true"><i style="width:${(L.tasted / L.members.length * 100).toFixed(1)}%"></i>${L.other ? `<b style="left:${(L.tasted / L.members.length * 100).toFixed(1)}%;width:${(L.other / L.members.length * 100).toFixed(1)}%"></b>` : ''}</span></summary>
        <ul class="jr-members">${L.members.map(m => `<li class="${m.st ? 'st-' + m.st : ''}"><a href="#${esc(m.link)}"><i class="jr-mk" aria-hidden="true"></i>${esc(m.name)}${m.tier ? `<small class="vm-num">${esc(m.tier)}</small>` : ''}${m.st ? `<span class="sr"> (${m.st === 'tasted' ? 'tasted' : m.st === 'cellar' ? 'in your cellar' : 'on your wishlist'})</span>` : ''}</a></li>`).join('')}</ul>
        ${L.other ? `<p class="jr-hint">${plural(L.other, 'more')} waiting in your cellar or wishlist.</p>` : ''}</details>`).join('');
    }).catch(e => { console.warn('[journal] classics', e); });
    suggestions().then(list => {
      const n = box.querySelector('[data-next]');
      if (!n || !list.length) return;
      n.innerHTML = VM.h.sec('Next to explore') + `<p class="note">Appellations you have not met yet: ${list.some(x => x.why === 'twin') ? 'climate twins of your favourites elsewhere in the world, and ' : ''}neighbours of the places you drink.</p>
        <ul class="list">${list.map(x => { const a = VM.data.indexById.get(x.id) || {}; return `<li><a class="row" href="#${esc(x.id)}"><span class="row-name">${esc(a.name || x.id)}<small>${esc(x.why === 'twin' ? `climate twin of ${placeName('appellation', x.seed)}` : `next door to ${placeName('appellation', x.seed)}`)} \u00b7 ${esc(VM.data.countryName(a.country))}</small></span><span class="row-meta">${esc(a.cat || '')}</span></a></li>`; }).join('')}</ul>`;
    }).catch(() => {});
  }

  /* ---------- profile sections: lists, notes, bottles ---------- */
  const MOUNT = new Set(), PENDING = new Set();
  const STRIP_LABEL = { visited: 'Visited', want_to_visit: 'To visit', want_to_taste: 'To taste', favourite: 'Favourite' };
  const targetOf = e => [e.type, e.type === 'grape' ? (e.gid || String(e.id).replace(/^grape-/, '')) : e.id];
  function renderPlace(m) {
    const [type, id] = targetOf(m.e);
    const note = J.notes.find(n => n.target_type === type && n.target_id === id);
    const editing = m.open || !!note;
    const nid = 'jr-note-' + Math.random().toString(36).slice(2, 8);
    m.el.innerHTML = `<div class="jr-strip" role="group" aria-label="Your lists">${STRIP_LISTS[type].map(l => `<button type="button" class="jr-tg" aria-pressed="${inList(l, type, id)}" data-list="${l}" aria-label="${esc(LIST_NAME[l])}">${esc(STRIP_LABEL[l])}</button>`).join('')}${editing ? '' : `<button type="button" class="jr-tg jr-tg-add" data-act="note">${icon('plus')}Note</button>`}<a class="jr-tg jr-tg-add" href="#journal-new-from-${esc(hashOf(type, id))}">${icon('plus')}Bottle</a></div>
      ${editing ? `<div class="jr-noteed"><label class="jr-nl" for="${nid}">Your note</label><textarea id="${nid}" class="jr-nta" rows="2" placeholder="What you know about ${esc(placeName(type, id))}, who to visit, what you drank">${esc(note ? note.body : '')}</textarea><span class="jr-nst" aria-live="polite"></span></div>` : ''}`;
    m.el.classList.add('jr-sec');
    const strip = m.el.querySelector('.jr-strip');
    const ovr = () => { strip.dataset.ovl = strip.scrollLeft > 2 ? '1' : '0'; strip.dataset.ovr = strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 2 ? '1' : '0'; };
    strip.addEventListener('scroll', ovr, { passive: true });
    requestAnimationFrame(ovr);
    const ta = m.el.querySelector('textarea');
    if (ta) {
      const st = m.el.querySelector('.jr-nst');
      const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(320, ta.scrollHeight + 2) + 'px'; };
      requestAnimationFrame(fit);
      const save = debounce(v => {
        saveNote(type, id, v).then(() => { if (st.isConnected) st.textContent = v.trim() ? 'Saved' : 'Removed'; }).catch(e => { if (st.isConnected) st.textContent = 'Not saved: ' + e.message; });
        PENDING.delete(save);
      }, 700);
      ta.addEventListener('input', () => { fit(); st.textContent = 'Saving\u2026'; PENDING.add(save); save(ta.value); });
      ta.addEventListener('blur', () => { save.flush(); if (!ta.value.trim()) { m.open = false; setTimeout(() => { if (m.el.isConnected && document.activeElement !== ta) renderPlace(m); }, 150); } });
      if (m.focus) { m.focus = false; ta.focus(); }
    }
  }
  function placeSection(el, e) {
    if (J.mode === 'off' || !STRIP_LISTS[e.type]) return false;
    const m = { el, e, kind: 'place', open: false };
    MOUNT.add(m);
    el.addEventListener('click', ev => {
      const t = ev.target.closest('[data-list], [data-act="note"]');
      if (!t) return;
      const [type, id] = targetOf(e);
      if (t.dataset.act === 'note') { m.open = true; m.focus = true; renderPlace(m); return; }
      const l = t.dataset.list;
      const on = t.getAttribute('aria-pressed') !== 'true';
      t.setAttribute('aria-pressed', String(on));
      toggleList(l, type, id, on).catch(err => { t.setAttribute('aria-pressed', String(!on)); toast(err.message); });
    });
    renderPlace(m);
  }
  async function renderBottlesSec(m) {
    const [type, id] = targetOf(m.e);
    if (type === 'region') await loadRegionApps(VM.data.isoOf(id));
    if (type === 'appellation' || type === 'site') await sitesReady();
    const l = bottlesFor(id, type);
    if (!l.length) { m.el.innerHTML = ''; m.el.hidden = true; return false; }
    m.el.hidden = false;
    m.el.innerHTML = VM.h.sec(`Your bottles ${type === 'grape' ? 'of this grape' : 'from here'} \u00b7 ${l.length}`) + `<ul class="list jr-list">${l.slice(0, 5).map(b => rowHTML(b, { mixed: true })).join('')}</ul>` + (l.length > 5 ? `<p class="note jr-more-link"><a href="#journal-from-${esc(hashOf(type, id))}">All ${l.length} in your journal</a></p>` : '');
    fillPhotos(m.el);
    return true;
  }
  function bottlesSection(el, e) {
    if (J.mode === 'off') return false;
    const m = { el, e, kind: 'bottles' };
    MOUNT.add(m);
    return renderBottlesSec(m);
  }
  function refreshSections(what) {
    for (const m of [...MOUNT]) {
      if (!m.el.isConnected) { MOUNT.delete(m); continue; }
      if (m.kind === 'place') {
        const ta = m.el.querySelector('textarea');
        if (ta && document.activeElement === ta) {
          const [type, id] = targetOf(m.e);
          for (const b of m.el.querySelectorAll('[data-list]')) b.setAttribute('aria-pressed', String(inList(b.dataset.list, type, id)));
        } else if (what !== 'sync' || !ta) renderPlace(m);
      } else if (what !== 'notes' && what !== 'lists') renderBottlesSec(m);
    }
  }
  const flushNotes = () => { for (const s of [...PENDING]) s.flush(); };

  /* ---------- keeping the screen in step ---------- */
  let _what = null;
  const refreshUI = debounce(() => {
    const what = _what; _what = null;
    updateMapSoon();
    refreshSections(what);
    rerender();
  }, 50);
  function refreshUIWrap(what) { _what = _what && _what !== what ? 'all' : what; refreshUI(); }

  /* ---------- start ---------- */
  VM.panel.register('journal', {
    title: 'Cellar journal', crumb: 'Cellar journal', snap: 'full', render: renderJournal,
    onClose() { flushNotes(); CUR.el = null; CUR.kind = null; }
  });
  VM.nav.add({ id: 'journal', label: 'Cellar', icon: icon('bottle'), order: 10, title: 'Your cellar journal: bottles, notes and lists' });
  if (GH) {
    VM.panel.addSection(['country', 'region', 'appellation', 'site', 'grape'], placeSection, { id: 'journal-place', slot: 'hero', order: 58 });
    VM.panel.addSection(['country', 'region', 'appellation', 'site', 'grape'], bottlesSection, { id: 'journal-bottles', slot: 'top', order: 58 });
    VM.on('map:ready', () => bindMap());
    if (HAS_LAYERS) {
      VM.layers.add({ id: 'journal-bottles', label: 'My bottles', note: 'pins from your cellar journal, coloured by style', order: 60, get: () => ML.on.bottles, set: on => setLayer('bottles', on) });
      VM.layers.add({ id: 'journal-places', label: 'My places', note: 'visited and want to visit', order: 61, get: () => ML.on.places, set: on => setLayer('places', on) });
    }
    VM.on('theme', () => repaintMap());
    VM.on('data:index', () => { updateMapSoon(); refreshSections('bottles'); });
    VM.on('profile:open', flushNotes);
    addEventListener('online', () => { if (J.mode === 'cloud') { flushOutbox(); cloudRefresh(); } });
    addEventListener('pagehide', flushNotes);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushNotes();
      else if (J.mode === 'cloud' && (!J.lastSync || Date.now() - Date.parse(J.lastSync) > 5 * 60e3)) cloudRefresh();
    });
    const start = () => bootAuth().catch(e => { console.warn('[journal] auth', e); if (!A.ready) onSession(null, 'NONE'); });
    /* after every module has registered its listeners: the 'auth' event is sticky and replays to late subscribers */
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true }); else setTimeout(start, 0);
  } else {
    readyRes();
    A.ready = true; VM.auth.ready = true; authRes(null);
  }
  if (GH) {
    /* pins at a cru move from the appellation point to the site once sites arrive (no forced second wave) */
    VM.on('data:sites', () => { updateMapSoon(); refreshSections('bottles'); });
    if (typeof VM.data.loadSites !== 'function') ready.then(() => { if (J.bottles.some(b => b.site_id)) sitesReady().then(updateMapSoon); });
  }
})();

</script>
<script data-module="30_somm">
/* modules/30_somm.js */
/* Vitis Mundi v2, sommelier tools: shared layer for 30_somm_*.js (filters, compare, study, tasting).
   - the attribute table: topo/_attrs.json when present, else the climate of the countries drawn so far
   - place summaries for any id (appellation, fine unit, site, region, country)
   - climate twins in standardised climate space
   - persistence (Supabase via VM.auth.client when signed in, else VM.store)
   - map shims until the lead's API has them (see frontend/API_REQUESTS.md)
   Exposed as VM.somm. */
(() => {
  if (!window.VM) return;
  const { esc, fold, arr, num, clamp } = VM.util;
  const SM = VM.somm = VM.somm || {};

  /* ---------- reference values ---------- */
  const COLS = ['country', 'gst', 'gdd', 'hi', 'prec', 'gsp', 'dtr', 'mjt', 'elev', 'slope', 'aspect', 'area', 'fine'];
  const NUMS = ['gst', 'gdd', 'hi', 'prec', 'gsp', 'dtr', 'mjt', 'elev', 'slope', 'aspect', 'area'];
  const ALIAS = { elev_mean: 'elev', e: 'elev', slope_mean: 'slope', s: 'slope', aspect_mean: 'aspect', a: 'aspect', area_km2: 'area', iso2: 'country', cc: 'country' };
  SM.META = {
    gst: { label: 'Growing-season temperature', short: 'Season warmth', unit: ' \u00b0C', d: 1 },
    gdd: { label: 'Growing degree days', short: 'Degree days', unit: '', d: 0 },
    hi: { label: 'Huglin index', short: 'Huglin', unit: '', d: 0 },
    prec: { label: 'Rain over the year', short: 'Rain, year', unit: ' mm', d: 0 },
    gsp: { label: 'Rain in the growing season', short: 'Rain, season', unit: ' mm', d: 0 },
    dtr: { label: 'Day\u2013night swing', short: 'Diurnal range', unit: ' \u00b0C', d: 1 },
    mjt: { label: 'Warmest month', short: 'Warmest month', unit: ' \u00b0C', d: 1 },
    elev: { label: 'Elevation', short: 'Elevation', unit: ' m', d: 0 },
    slope: { label: 'Mean slope', short: 'Slope', unit: '%', d: 1 },
    aspect: { label: 'Aspect', short: 'Aspect', unit: '\u00b0', d: 0 },
    area: { label: 'Area', short: 'Area', unit: ' km\u00b2', d: 1 }
  };
  SM.fmtv = (k, v) => {
    if (v == null || Number.isNaN(v)) return '';
    const m = SM.META[k] || { d: 0, unit: '' };
    if (k === 'area') return VM.fmt.area(v)?.v || '';
    if (k === 'aspect') return SM.octName(v);
    return VM.fmt.num(v, m.d) + m.unit;
  };
  SM.OCT = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  SM.OCT_LONG = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
  SM.oct = deg => deg == null || Number.isNaN(deg) ? -1 : Math.round((((deg % 360) + 360) % 360) / 45) % 8;
  SM.octName = deg => { const o = SM.oct(deg); return o < 0 ? '' : SM.OCT[o]; };
  /* Winkler regions as the core draws them (degree days, \u00b0C) */
  SM.WK = ['below I', 'I', 'II', 'III', 'IV', 'V'];
  SM.wkIdx = g => g == null || Number.isNaN(g) ? -1 : g < 850 ? 0 : g < 1389 ? 1 : g < 1668 ? 2 : g < 1945 ? 3 : g < 2223 ? 4 : 5;
  SM.hiName = h => h == null || Number.isNaN(h) ? '' : h < 1500 ? 'very cool' : h < 1800 ? 'cool' : h < 2100 ? 'temperate' : h < 2400 ? 'warm temperate' : h < 2700 ? 'warm' : 'very warm';
  /* the Old World, for grouping: Europe, the Caucasus, the eastern Mediterranean and North Africa */
  SM.OLD = new Set('fr it es pt de at ch gr hu ro bg hr si sk cz rs ba me mk al md ua ru ge am az tr cy mt lu be nl gb dk se no pl lt lv ee by ie lb il ps jo sy iq ir eg ly tn dz ma xk li ad mc sm va'.split(' '));
  SM.world = iso => SM.OLD.has(iso) ? 'old' : 'new';
  SM.cmpTok = ['--sm-s1', '--sm-s2', '--sm-s3'];

  /* ---------- small helpers ---------- */
  SM.kmBetween = (a, b) => {
    if (!a || !b) return Infinity;
    const R = 6371, r = Math.PI / 180;
    const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  };
  SM.kmPerPx = (lat, z) => 40075.016686 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, z));
  function ringHas(r, x, y) {
    let c = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  const polysOf = g => !g ? [] : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  SM.inGeom = (g, lon, lat) => polysOf(g).some(p => p.length && ringHas(p[0], lon, lat) && !p.slice(1).some(h => ringHas(h, lon, lat)));
  SM.kmToGeom = (g, lon, lat) => {
    const kx = Math.cos(lat * Math.PI / 180) * 111.32, ky = 110.57;
    let best = Infinity;
    for (const p of polysOf(g)) for (const r of p) for (let i = 1; i < r.length; i++) {
      const ax = (r[i - 1][0] - lon) * kx, ay = (r[i - 1][1] - lat) * ky, bx = (r[i][0] - lon) * kx, by = (r[i][1] - lat) * ky;
      const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
      const t = L ? clamp(-(ax * dx + ay * dy) / L, 0, 1) : 0;
      const d = Math.hypot(ax + t * dx, ay + t * dy);
      if (d < best) best = d;
    }
    return best;
  };
  SM.median = a => { const v = a.filter(x => x != null && !Number.isNaN(x)).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
  SM.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  SM.plural = (n, one, many) => `${VM.fmt.num(n)} ${n === 1 ? one : (many || one + 's')}`;
  SM.nameOf = id => { const e = VM.data.entity(id); return e && e.name && e.name !== id ? e.name : id; };
  SM.list = items => items.length < 2 ? (items[0] || '') : items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
  /* a crumb-sized description of any place: "AOC \u00b7 France" */
  SM.metaOf = id => {
    const e = VM.data.entity(id);
    if (!e) return '';
    const cn = e.country ? VM.data.countryName(e.country) : '';
    if (e.type === 'appellation') return [e.subcat || e.cat, cn].filter(Boolean).join(' \u00b7 ');
    if (e.type === 'site') return ['Site', cn].filter(Boolean).join(' \u00b7 ');
    if (e.type === 'region') return ['Region', cn].filter(Boolean).join(' \u00b7 ');
    if (e.type === 'country') return 'Country';
    return '';
  };

  /* ---------- the attribute table ---------- */
  let TAB = null, dirty = false, building = null;
  function emptyTable(n, src) {
    const t = { src, n, ids: new Array(n), at: new Map(), country: new Array(n), fine: new Uint8Array(n), num: {}, has: {} };
    for (const k of NUMS) t.num[k] = new Float32Array(n).fill(NaN);
    return t;
  }
  function finish(t) {
    for (const k of NUMS) { const a = t.num[k]; let c = 0; for (let i = 0; i < t.n; i++) if (!Number.isNaN(a[i])) c++; t.has[k] = c; }
    t.anc = new Map();
    t.ancOf = i => {
      if (t.anc.has(i)) return t.anc.get(i);
      const ids = VM.data.ancestry(t.ids[i]).map(a => a.id);
      t.anc.set(i, ids);
      return ids;
    };
    t.row = id => { const i = t.at.get(id); return i == null ? null : rowObj(t, i); };
    return t;
  }
  function rowObj(t, i) {
    const o = { id: t.ids[i], country: t.country[i], fine: t.fine[i] };
    for (const k of NUMS) { const v = t.num[k][i]; o[k] = Number.isNaN(v) ? null : v; }
    return o;
  }
  function fromAttrs(j) {
    const cols = arr(j._cols).length ? j._cols.map(c => ALIAS[c] || c) : COLS;
    const keys = Object.keys(j).filter(k => k !== '_cols' && Array.isArray(j[k]));
    const t = emptyTable(keys.length, 'attrs');
    const ci = {}; cols.forEach((c, i) => { ci[c] = i; });
    keys.forEach((id, i) => {
      const r = j[id];
      t.ids[i] = id; t.at.set(id, i);
      const ix = VM.data.indexById.get(id);
      t.country[i] = String(r[ci.country] ?? ix?.country ?? VM.data.isoOf(id) ?? '').toLowerCase();
      t.fine[i] = (ci.fine != null ? +r[ci.fine] : 0) || (ix?.fine ? 1 : 0);
      for (const k of NUMS) { const v = ci[k] != null ? num(r[ci[k]]) : null; if (v != null) t.num[k][i] = v; }
      if (Number.isNaN(t.num.area[i]) && ix?.area != null) t.num.area[i] = ix.area;
    });
    return finish(t);
  }
  /* without _attrs.json: the index plus the clim block of every feature already drawn */
  function fromIndex() {
    const idx = VM.data.index;
    const t = emptyTable(idx.length, 'clim');
    idx.forEach((a, i) => {
      t.ids[i] = a.id; t.at.set(a.id, i);
      t.country[i] = a.country; t.fine[i] = a.fine ? 1 : 0;
      if (a.area != null) t.num.area[i] = a.area;
      const c = VM.data.feature(a.id)?.clim;
      if (c) for (const k of ['gst', 'gdd', 'hi', 'prec', 'gsp', 'dtr', 'mjt']) { const v = num(c[k]); if (v != null) t.num[k][i] = v; }
      if (c && c.elev != null) t.num.elev[i] = +c.elev;
    });
    return finish(t);
  }
  SM.table = async function table() {
    if (TAB && !(TAB.src === 'clim' && dirty)) return TAB;
    if (building) return building;
    building = (async () => {
      await Promise.race([VM.data.loadIndex(), VM.util.sleep(15000)]);
      const j = await VM.data.json('data/topo/_attrs.json');
      TAB = j ? fromAttrs(j) : fromIndex();
      dirty = false;
      return TAB;
    })();
    try { return await building; } finally { building = null; }
  };
  SM.tableNow = () => TAB;
  VM.on('data:geo', iso => { if (!TAB || TAB.src === 'clim') { dirty = true; VM.emit('somm:geo', iso); } });

  /* population statistics per column (non-fine rows unless asked), cached */
  const _stats = new Map();
  SM.stats = (t, k, fine) => {
    const key = t.src + t.n + k + (fine ? 'f' : '');
    if (_stats.has(key)) return _stats.get(key);
    const v = [];
    const a = t.num[k];
    for (let i = 0; i < t.n; i++) if (!Number.isNaN(a[i]) && (fine || !t.fine[i])) v.push(a[i]);
    v.sort((x, y) => x - y);
    const q = p => v.length ? v[Math.min(v.length - 1, Math.max(0, Math.round(p * (v.length - 1))))] : null;
    const mean = v.reduce((s, x) => s + x, 0) / (v.length || 1);
    const sd = Math.sqrt(v.reduce((s, x) => s + (x - mean) ** 2, 0) / (v.length || 1)) || 1;
    const s = { n: v.length, mean, sd, q, min: v[0], max: v[v.length - 1] };
    _stats.set(key, s);
    return s;
  };

  /* ---------- grapes per appellation (reverse of _varieties.json, inherited down the nesting) ---------- */
