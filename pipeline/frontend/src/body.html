<div id="app" data-sheet="closed">
  <div id="map" role="region" aria-label="Wine atlas globe. Drag to turn it, scroll or pinch to zoom, tap a place to open its profile."></div>
  <div id="nomap" class="nomap" hidden>
    <p>The map engine could not load, so the globe is missing. Search, profiles and the reference views still work.</p>
  </div>

  <header class="mast">
    <div class="search" role="search">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <label for="q" class="sr">Search the atlas</label>
        <input id="q" type="search" placeholder="Search appellations, grapes, places" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
        <button class="icon-btn" id="q-clear" type="button" aria-label="Clear search" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <ul id="results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
    <nav class="views" aria-label="Views">
      <button type="button" data-view="grapes" aria-pressed="false">Grapes</button>
      <button type="button" data-view="timeline" aria-pressed="false">Timeline</button>
      <button type="button" data-view="lexicon" aria-pressed="false">Lexicon</button>
      <button type="button" data-view="layers" aria-pressed="false">Layers</button>
    </nav>
  </header>

  <div class="ctl" id="ctl">
    <div class="ctl-group">
      <button type="button" id="zin" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zout" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button>
    </div>
    <div class="ctl-group">
      <button type="button" id="compass" aria-label="Face north"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 15 12H9z" fill="var(--accent)"/><path d="M12 21 9 12h6z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button type="button" id="home" aria-label="Show the whole globe"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/><path d="M3.5 12h17M5 7.5h14M5 16.5h14"/></svg></button>
    </div>
  </div>

  <section class="cartouche" id="cartouche" aria-label="Map key">
    <div class="brand">
      <h1><button type="button" id="brand" aria-label="About Vitis Mundi">Vitis Mundi</button></h1>
      <span class="sub">an atlas of wine places</span>
    </div>
    <p class="hint" id="hint">Tap a country to read its story. Zoom in and every appellation appears, across borders.</p>
    <div class="legend" id="legend" data-collapsed="false">
      <div class="legend-head">
        <span class="legend-title" id="legend-title">Colour of the wine</span>
        <button type="button" class="legend-toggle" id="legend-toggle" aria-expanded="true" aria-controls="legend-body">Hide key</button>
      </div>
      <div class="legend-body" id="legend-body"></div>
    </div>
    <div class="readout">
      <span class="scale" id="scale"></span>
      <span class="coords" id="coords" aria-label="Map centre">0.00°N 0.00°E</span>
      <span id="zl">z 1.5</span>
      <span id="loading" role="status" hidden><i class="dot"></i><span id="loading-t"></span></span>
    </div>
  </section>

  <div id="pill" class="pill" role="status" hidden></div>
  <section id="strip" class="strip" aria-label="Timeline of wine" hidden></section>

  <aside id="sheet" class="sheet" aria-label="Profile" hidden>
    <div class="sheet-handle" id="handle" aria-hidden="true"></div>
    <div class="sheet-bar" id="sheet-bar">
      <button type="button" class="icon-btn" id="back" aria-label="Back" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5 8 12l7 7"/></svg></button>
      <span class="crumb" id="sheet-crumb"></span>
      <button type="button" class="icon-btn" id="snap" aria-label="Expand panel" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="icon-btn" id="close" aria-label="Close panel"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body" tabindex="-1"></div>
  </aside>

  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>
